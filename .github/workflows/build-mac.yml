name: Build Mac app

on:
  workflow_dispatch:   # adds a manual "Run workflow" button on GitHub

jobs:
  build:
    runs-on: macos-14   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the .dmg
        run: npx electron-builder --mac --publish never

      - name: Sanity-check the packaged app
        run: |
          APP="dist/mac-arm64/Production Board.app"
          FF="$APP/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg"
          file "$FF"
          "$FF" -version | head -1
          "$FF" -hide_banner -encoders | grep -E "videotoolbox|libx264" || echo "WARNING: no h264 encoder found in bundled ffmpeg"
          codesign --verify --deep --strict "$APP" && echo "signature OK (ad-hoc)"

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Production-Board-mac
          path: dist/*.dmg
