name: Build Mac app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the .dmg
        run: npx electron-builder --mac --publish never

      - name: Show build output
        run: find dist -maxdepth 2

      - name: Sanity-check the packaged app
        continue-on-error: true
        run: |
          APP=$(find dist -maxdepth 2 -name "*.app" -type d | head -1)
          echo "App found at: $APP"
          [ -n "$APP" ] || { echo "No .app found"; exit 1; }
          FF=$(find "$APP" -name ffmpeg -type f | head -1)
          echo "ffmpeg found at: $FF"
          file "$FF"
          "$FF" -version | head -1
          "$FF" -hide_banner -encoders | grep -E "videotoolbox|libx264" || echo "WARNING: no h264 encoder found in bundled ffmpeg"
          codesign --verify --deep --strict "$APP" && echo "signature OK (ad-hoc)"

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Video-Editor-mac
          path: dist/*.dmg
