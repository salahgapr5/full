<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salah Gapr — Production Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.0/lame.min.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
<style>
/* =========================================================================
   SALAH GAPR — visual identity: a clean, bright production board. White
   surfaces, blue accent, a touch of red for status/danger. Sans-serif type
   throughout for a crisp modern feel, monospace reserved for slate/timecode
   -style data. Every surface stays light, airy, and easy to scan.
   ========================================================================= */

:root{
  /* base surfaces */
  --ink:        #f4f7fc;
  --ink-2:      #ffffff;
  --ink-3:      #eef2f9;
  --ink-4:      #e3e9f4;
  --line:       rgba(20,40,80,0.08);
  --line-strong:rgba(20,40,80,0.14);

  /* text */
  --paper:      #0f2545;
  --text:       #1e2c42;
  --text-soft:  #5b6b84;
  --text-dim:   #8b97ab;

  /* brand accent — blue */
  --brass:      #2563eb;
  --brass-hi:   #3b82f6;
  --brass-ink:  #ffffff;

  /* status */
  --good:       #15803d;
  --good-ink:   #e5f7ec;
  --warn:       #b45309;
  --danger:     #dc2626;
  --danger-ink: #fdecea;

  /* live per-person theme, set by JS on tabs/cards */
  --pclr:       var(--brass);
  --pclr-dark:  var(--brass-ink);
  --pclr-soft:  rgba(37,99,235,0.10);
  --pclr-line:  rgba(37,99,235,0.30);
  --pclr-ring:  rgba(37,99,235,0.18);
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background: var(--ink);
  color:var(--text);
  font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{ background:var(--brass); color:var(--brass-ink); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--ink-4); border-radius:8px; border:2px solid var(--ink); }
::-webkit-scrollbar-thumb:hover{ background:var(--pclr); }
:focus-visible{ outline:2px solid var(--brass-hi); outline-offset:2px; border-radius:2px; }

.mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }
a{ color:inherit; }

.page-inner{ max-width:1220px; margin:0 auto; padding-left:28px; padding-right:28px; }

/* ---------------------------------------------------------------- header */
header.top{
  padding:20px 0 18px;
  background:var(--ink-2);
  border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:30;
}
.header-inner{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.brand{ display:flex; align-items:center; gap:13px; }
.brand-photo{
  width:42px; height:42px; border-radius:50%; flex-shrink:0;
  object-fit:cover;
  border:2px solid var(--brass);
  box-shadow:0 3px 10px rgba(37,99,235,0.22);
}
.brand-word{ font-size:21px; font-weight:800; letter-spacing:0.2px; color:var(--paper); line-height:1; }

.site-logo-wrap{ display:flex; align-items:center; gap:6px; margin-left:6px; }
.site-logo-img{ height:36px; max-width:150px; object-fit:contain; border-radius:6px; }
.site-logo-add-btn{
  font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; letter-spacing:0.2px;
  padding:8px 12px; border-radius:8px; border:1.5px dashed var(--line-strong);
  background:var(--ink-3); color:var(--text-soft); cursor:pointer; white-space:nowrap;
  transition:border-color .14s, color .14s, background .14s;
}
.site-logo-add-btn:hover{ border-color:var(--brass); color:var(--paper); background:var(--pclr-soft); }
.site-logo-remove-btn{
  width:20px; height:20px; border-radius:50%; border:none; cursor:pointer;
  background:var(--danger); color:#fff; font-size:13px; font-weight:700; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.site-logo-remove-btn:hover{ background:#b91c1c; }

.toolbtns{ display:flex; align-items:center; gap:10px; }
.sync-pill{
  font-family:'IBM Plex Mono',monospace; font-size:11px;
  display:flex; align-items:center; gap:7px;
  padding:7px 13px; border-radius:20px;
  background:var(--ink-3); border:1px solid var(--line-strong);
  color:var(--text-soft);
}
.sync-pill .dot{ width:7px; height:7px; border-radius:50%; background:var(--warn); box-shadow:0 0 0 3px rgba(59,130,246,0.18); }
.sync-pill.live .dot{ background:var(--good); box-shadow:0 0 0 3px rgba(21,128,61,0.2); animation:pulse-dot 2s infinite; }
.sync-pill.offline .dot{ background:var(--danger); box-shadow:0 0 0 3px rgba(220,38,38,0.2); }
@keyframes pulse-dot{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }

.btn{
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; letter-spacing:0.2px;
  padding:9px 15px; border-radius:7px; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  border:1px solid var(--line-strong); background:var(--ink-3); color:var(--text);
  transition:background .14s, border-color .14s, transform .1s, color .14s;
}
.btn svg{ width:13px; height:13px; }
.btn:hover{ background:var(--ink-4); border-color:var(--text-dim); }
.btn:active{ transform:translateY(1px); }
.btn-brass{ background:var(--brass); border-color:var(--brass); color:var(--brass-ink); font-weight:700; }
.btn-brass:hover{ background:var(--brass-hi); border-color:var(--brass-hi); }
.btn-ghost{ background:transparent; }
.btn-danger{ color:var(--danger); }
.btn-danger:hover{ background:rgba(220,38,38,0.14); border-color:var(--danger); }
.btn-sm{ padding:6px 11px; font-size:10.5px; }

/* ---------------------------------------------------------------- crew tabs */
nav.tabs{ padding:16px 0; background:var(--ink-2); border-bottom:1px solid var(--line); }
/* Hidden when this page is embedded inside the app shell — the shell draws its own two tab rows and drives this page's state via executeJavaScript(). Standalone-in-browser use still shows this nav. */
body.embedded nav.tabs{ display:none; }
.tabs-inner{ display:flex; gap:10px; flex-wrap:nowrap; width:100%; overflow-x:auto; }
.tab{
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:700;
  background:var(--pclr); color:#ffffff;
  border:1px solid var(--pclr-dark); border-radius:12px;
  padding:8px 14px 8px 8px; flex:0 0 auto; cursor:pointer;
  display:flex; align-items:center; gap:10px;
  transition:filter .15s, transform .15s, box-shadow .15s;
}
.tab:hover{ filter:brightness(1.08); transform:translateY(-1px); }
.tab.active{ box-shadow:0 0 0 3px rgba(255,255,255,0.55) inset, 0 6px 16px rgba(20,40,80,0.18); transform:translateY(-1px); }

.tab-avatar-ring{
  width:38px; height:38px; border-radius:50%; padding:2.5px; flex-shrink:0;
  background:conic-gradient(#ffffff calc(var(--pct,0)*1%), rgba(255,255,255,0.32) 0);
  display:flex; align-items:center; justify-content:center;
}
.tab-avatar{
  width:100%; height:100%; border-radius:50%; overflow:hidden;
  background:#ffffff; display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:700; color:var(--pclr);
  cursor:pointer; border:2px solid #ffffff;
}
.tab-avatar img{ width:100%; height:100%; object-fit:cover; }
.tab-info{ display:flex; flex-direction:column; min-width:0; }
.tab-name{ font-size:13px; font-weight:800; white-space:nowrap; color:#ffffff; }
.tab .progress{ display:block; font-size:10px; margin-top:2px; color:rgba(255,255,255,0.85); white-space:nowrap; font-weight:700; }
.tab.active .progress{ color:rgba(255,255,255,0.95); }
.tab-divider{ width:1px; align-self:stretch; background:var(--line-strong); margin:4px 3px; flex-shrink:0; }

/* ---------------------------------------------------------------- board */
main.board{ padding:30px 0 70px; }

.video-group{
  border:10px solid var(--brass);
  border-radius:14px;
  margin-bottom:30px;
  overflow:hidden;
  background:var(--ink-2);
  box-shadow:0 14px 30px rgba(20,40,80,0.08);
  transition:box-shadow .18s, transform .18s;
}
.video-group:hover{ box-shadow:0 20px 40px rgba(20,40,80,0.12); transform:translateY(-2px); }

.video-head{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:14px 20px;
  background:var(--ink-3);
  border-bottom:1px solid var(--line);
}
.video-head-left{ display:flex; align-items:center; gap:10px; }
.reel-icon{ width:22px; height:22px; color:var(--pclr); flex-shrink:0; }
.video-head h2{
  margin:0; font-size:16px; font-weight:600; color:var(--paper);
  font-family:'IBM Plex Mono',monospace; letter-spacing:0.4px;
}
.video-head .status-chip{
  font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; letter-spacing:0.4px;
  padding:3px 9px; border-radius:20px; text-transform:uppercase;
  background:var(--ink-4); color:var(--text-dim);
}
.video-group.done .status-chip{ background:var(--good-ink); color:var(--good); }
.video-head-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

.done-toggle{
  display:flex; align-items:center; gap:8px;
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:700;
  background:transparent; border:1.5px solid var(--pclr); color:var(--pclr);
  padding:7px 14px 7px 7px; border-radius:22px; cursor:pointer;
  transition:background .15s, color .15s, border-color .15s, transform .1s;
}
.done-toggle:active{ transform:scale(0.96); }
.done-toggle .check-circle{
  width:20px; height:20px; border-radius:50%; border:2px solid currentColor;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.done-toggle .check-circle svg{ width:12px; height:12px; }
.done-toggle.is-done{ background:var(--good); border-color:var(--good); color:var(--good-ink); }
.done-toggle.is-done .check-circle{ background:var(--good-ink); color:var(--good); }

/* youtube link row */
.yt-row{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:13px 20px; background:var(--ink); border-bottom:1px solid var(--line);
}
.yt-row .yt-label{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-dim); white-space:nowrap; }
.yt-row input{
  flex:1; min-width:200px;
  font-family:'IBM Plex Mono',monospace; font-size:12px;
  padding:9px 12px; border-radius:6px;
  border:1.5px solid var(--line-strong); background:var(--ink-2); color:var(--text);
}
.yt-row input::placeholder{ color:var(--text-dim); }
.yt-row input:focus{ outline:none; border-color:var(--pclr); box-shadow:0 0 0 3px var(--pclr-ring); }
.yt-row input.input-error{ border-color:var(--danger); box-shadow:0 0 0 3px rgba(220,38,38,0.22); animation:shake .3s; }
@keyframes shake{ 25%{ transform:translateX(-4px); } 75%{ transform:translateX(4px); } }
.yt-row.uploaded-row{ background:var(--ink-3); border-bottom:1px solid var(--line-strong); }
.yt-row.uploaded-row .yt-label{ color:var(--pclr); font-weight:700; }
.yt-row.uploaded-row input{ border-color:var(--pclr-line); }
.yt-btn{
  display:flex; align-items:center; gap:6px;
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:0.2px;
  background:var(--ink-3); border:1px solid var(--line-strong); color:var(--text-soft);
  padding:9px 12px; border-radius:6px; cursor:pointer; white-space:nowrap;
  transition:background .12s, color .12s, border-color .12s;
}
.yt-btn:hover{ background:var(--pclr-soft); border-color:var(--pclr); color:var(--paper); }
.yt-btn svg{ width:12px; height:12px; }

.grid{ display:grid; grid-template-columns:repeat(6, 1fr); gap:14px; padding:20px; }
.card{
  grid-column:span 3;
  background:var(--ink-3);
  border:1px solid var(--line);
  border-left:3px solid var(--pclr);
  border-radius:9px;
  padding:14px 16px 12px;
  min-height:126px;
  display:flex; flex-direction:column;
  transition:border-color .15s, background .15s;
}
.card:hover{ background:var(--ink-4); }
.card[data-type="title"]{ grid-column:span 6; }
.card[data-type="introAvatar"]{ grid-column:span 6; }
.card[data-type="script"]{ grid-column:span 6; min-height:190px; }
.card[data-type="description"]{ grid-column:span 3; }
.card[data-type="tags"]{ grid-column:span 3; }
.card[data-type="notes"]{ grid-column:span 6; min-height:100px; }

.title-row{ display:flex; gap:16px; align-items:stretch; }
.title-row .card-body{ flex:1; min-width:0; }
.title-thumb-preview{
  width:172px; height:97px; flex-shrink:0; object-fit:cover; border-radius:8px;
  border:1.5px solid var(--line-strong); background:var(--ink);
}
@media (max-width:720px){
  .title-row{ flex-wrap:wrap; }
  .title-thumb-preview{ width:100%; height:170px; }
}

.card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; gap:8px; flex-wrap:wrap; }
.card-label{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:700; letter-spacing:0.5px; color:var(--paper); text-transform:uppercase; }
.card-actions{ display:flex; gap:6px; flex-wrap:wrap; }
.icon-btn{
  width:26px; height:26px; border-radius:5px; border:1px solid var(--line-strong);
  background:var(--ink-2); display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--text-soft);
  transition:background .12s, color .12s, border-color .12s, transform .1s;
}
.icon-btn:hover{ background:var(--pclr-soft); color:var(--paper); border-color:var(--pclr); }
.icon-btn:active{ transform:scale(0.92); }
.icon-btn svg{ width:13px; height:13px; }

.copy-btn-text{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:0.2px;
  background:var(--ink-2); border:1px solid var(--line-strong); color:var(--text-soft);
  padding:6px 12px; border-radius:5px; cursor:pointer;
  display:flex; align-items:center; gap:6px;
  transition:background .12s, color .12s, border-color .12s;
}
.copy-btn-text:hover{ background:var(--pclr-soft); color:var(--paper); border-color:var(--pclr); }
.copy-btn-text svg{ width:12px; height:12px; }

.download-thumb-btn{
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700; letter-spacing:0.2px;
  background:var(--brass); border:1px solid var(--brass); color:var(--brass-ink);
  padding:6px 12px; border-radius:5px; cursor:pointer;
  display:flex; align-items:center; gap:6px; white-space:nowrap;
  transition:background .12s, transform .1s;
}
.download-thumb-btn:hover{ background:var(--brass-hi); }
.download-thumb-btn:active{ transform:translateY(1px); }
.download-thumb-btn svg{ width:12px; height:12px; }

.card-body{
  flex:1; outline:none; font-size:14.5px; line-height:1.55; color:var(--text);
  word-wrap:break-word; white-space:pre-wrap; max-height:150px; overflow-y:auto;
}
.card[data-type="title"] .card-body{ font-size:19px; font-weight:600; line-height:1.35; max-height:100px; color:var(--paper); }
.card[data-type="script"] .card-body{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; line-height:1.65; max-height:270px; }
.card[data-type="tags"] .card-body{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; }
.card-body:empty:before{ content:attr(data-placeholder); color:var(--text-dim); font-style:italic; }

.video-group.done .grid{ opacity:0.55; }
.video-group.done .card-body{ text-decoration:line-through; text-decoration-color:var(--text-dim); }

.toast{
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(10px);
  background:var(--paper); color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600;
  padding:11px 20px; border-radius:8px; opacity:0; pointer-events:none;
  transition:opacity .2s, transform .2s; z-index:50; box-shadow:0 12px 28px rgba(20,40,80,0.16);
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width:720px){
  .grid{ grid-template-columns:repeat(2,1fr); }
  .card{ grid-column:span 2 !important; }
}

/* ================================================================ MANAGER */
.mgr-dashboard{ padding-bottom:10px; }
.mgr-dash-header{ display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:22px; }
.mgr-dash-title{ font-family:'Inter',sans-serif; font-size:26px; font-weight:800; color:var(--paper); }
.mgr-dash-sub{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-dim); margin-top:5px; }

.mgr-subnav{ display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--line-strong); margin-bottom:26px; }
.mgr-subnav-btn{
  display:flex; align-items:center; gap:7px;
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600;
  background:none; border:none; color:var(--text-dim);
  padding:11px 16px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;
  transition:color .15s, border-color .15s;
}
.mgr-subnav-btn svg{ width:14px; height:14px; }
.mgr-subnav-btn:hover{ color:var(--text); }
.mgr-subnav-btn.active{ color:var(--brass-hi); border-bottom-color:var(--brass-hi); }

.mgr-panel-title{ font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:700; color:var(--text-soft); letter-spacing:0.4px; margin:0 0 14px; }
.mgr-section-title{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; color:var(--text-soft); margin:28px 0 12px; }

.overview-top{ display:grid; grid-template-columns:1.1fr 1.4fr; gap:16px; margin-bottom:28px; }
@media (max-width:860px){ .overview-top{ grid-template-columns:1fr; } }

.hero-card{
  background:#dce9ff;
  border:1px solid var(--pclr-line);
  border-radius:16px; padding:26px; display:flex; align-items:center; gap:20px;
  box-shadow:0 16px 34px rgba(20,40,80,0.10);
}
.ring-wrap{ position:relative; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.ring-center-text{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-weight:700; }
.hero-copy .ring-label{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.5px; color:#1d4ed8; font-weight:700; margin-bottom:6px; }
.hero-copy .ring-title{ font-family:'Inter',sans-serif; font-weight:800; font-size:22px; color:var(--paper); margin-bottom:5px; }
.hero-copy .ring-sub{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-soft); }

.activity-card{
  background:#fdf3d9; border:1px solid #f0dfa0; border-radius:16px; padding:22px;
  box-shadow:0 16px 34px rgba(20,40,80,0.08);
  display:flex; flex-direction:column;
}
.activity-list{ display:flex; flex-direction:column; gap:2px; overflow-y:auto; max-height:212px; }
.activity-row{ display:flex; align-items:flex-start; gap:11px; padding:10px 2px; border-bottom:1px solid rgba(20,40,80,0.10); }
.activity-row:last-child{ border-bottom:none; }
.activity-dot{ width:9px; height:9px; border-radius:50%; margin-top:6px; flex-shrink:0; }
.activity-body{ flex:1; min-width:0; }
.activity-line{ font-size:13.5px; color:var(--text); line-height:1.4; }
.activity-line b{ color:var(--paper); font-weight:600; }
.activity-meta{ display:flex; align-items:center; gap:10px; margin-top:4px; flex-wrap:wrap; }
.activity-time{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-soft); font-weight:600; }
.activity-link{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text-soft); font-weight:600; text-decoration:none; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.watch-btn{
  display:inline-flex; align-items:center; gap:5px;
  font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:700;
  color:var(--brass-hi); text-decoration:none; border:1px solid var(--pclr-line);
  padding:4px 9px; border-radius:20px; background:var(--pclr-soft);
  transition:background .12s, color .12s;
  white-space:nowrap;
}
.watch-btn:hover{ background:var(--brass); color:var(--brass-ink); border-color:var(--brass); }
.watch-btn svg{ width:9px; height:9px; }

.links-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px; padding:4px 0 40px; }

<script>
let PEOPLE = [
  {id:'omar', name:'Omar'},
  {id:'amr', name:'Amr'},
  {id:'ahmed', name:'Ahmed'},
  {id:'mahmoud', name:'Mahmoud'},
];

const CARD_TYPES = [
  {key:'title', label:'Title', placeholder:'Untitled task…'},
  {key:'introAvatar', label:'Intro avatar video', placeholder:'Avatar intro video link / notes…'},
  {key:'script', label:'Script', placeholder:'Write the script here…'},
  {key:'description', label:'Description', placeholder:'What is this about…'},
  {key:'tags', label:'Tags', placeholder:'#tag1, #tag2…'},
  {key:'notes', label:'Notes', placeholder:'Any extra notes…'},
];

function emptyCards(){
  const obj = {};
  CARD_TYPES.forEach(c=> obj[c.key] = { text:'' });
  return obj;
}

const MANAGER_ID = 'manager';
const LINKS_ID = 'links';
const ACCOUNTS_ID = 'accounts';
const AUDIO_ID = 'audio';
const VIDEO_ID = 'video';
const THUMB_ID = 'thumbnail';
const INFO_ID = 'informations';

// Each person (and the manager) gets their own crew-badge color.
const PERSON_THEME = {
  omar:    { color:'#5B9BD9', dark:'#2E5C8A', soft:'rgba(91,155,217,0.14)',  line:'rgba(91,155,217,0.35)',  ring:'rgba(91,155,217,0.22)' },
  amr:     { color:'#15803D', dark:'#0F5E2E', soft:'rgba(21,128,61,0.14)', line:'rgba(21,128,61,0.35)', ring:'rgba(21,128,61,0.22)' },
  ahmed:   { color:'#B48CDE', dark:'#6A4A8F', soft:'rgba(180,140,222,0.14)', line:'rgba(180,140,222,0.35)', ring:'rgba(180,140,222,0.22)' },
  mahmoud: { color:'#E0A05B', dark:'#8A5C2A', soft:'rgba(224,160,91,0.14)',  line:'rgba(224,160,91,0.35)',  ring:'rgba(224,160,91,0.22)' },
  manager: { color:'#DC2626', dark:'#B91C1C', soft:'rgba(220,38,38,0.14)', line:'rgba(220,38,38,0.35)', ring:'rgba(220,38,38,0.22)' },
  links:   { color:'#4FBDB0', dark:'#276A62', soft:'rgba(79,189,176,0.14)', line:'rgba(79,189,176,0.35)', ring:'rgba(79,189,176,0.22)' },
  thumbnail:{ color:'#16A34A', dark:'#166534', soft:'rgba(22,163,74,0.14)', line:'rgba(22,163,74,0.35)', ring:'rgba(22,163,74,0.22)' },
  video:   { color:'#7C3AED', dark:'#5B21B6', soft:'rgba(124,58,237,0.14)', line:'rgba(124,58,237,0.35)', ring:'rgba(124,58,237,0.22)' },
  audio:   { color:'#DB2777', dark:'#9D174D', soft:'rgba(219,39,119,0.14)', line:'rgba(219,39,119,0.35)', ring:'rgba(219,39,119,0.22)' },
  informations:{ color:'#0891B2', dark:'#155E75', soft:'rgba(8,145,178,0.14)', line:'rgba(8,145,178,0.35)', ring:'rgba(8,145,178,0.22)' },
  accounts:{ color:'#B45309', dark:'#7C3A05', soft:'rgba(180,83,9,0.14)', line:'rgba(180,83,9,0.35)', ring:'rgba(180,83,9,0.22)' },
};

// Buttons shown on the "Links" page — quick access to every tool used for production.
// These are editable at runtime (admin can add/edit/remove), so QUICK_LINKS is a
// mutable array kept in sync with everyone else's board via Firestore, the same
// way the rest of the shared state is. DEFAULT_QUICK_LINKS is only the starter
// set used the very first time the shared doc is created.
const DEFAULT_QUICK_LINKS = [
  { label:'HeyGen — Avatar Video Website', url:'https://app.heygen.com', color:'#2563EB' },
  { label:'Minimax — Audio', url:'https://www.minimax.io/audio', color:'#DC2626' },
  { label:'Gemini — Thumbnail Generator', url:'https://gemini.google.com/images', color:'#0F766E' },
  { label:'Pixabay — B-roll', url:'https://pixabay.com', color:'#D97706' },
  { label:'Pexels — B-roll (2nd)', url:'https://www.pexels.com', color:'#7C3AED' },
  { label:'YouTube Video Downloader', url:'https://v37.www-y2mate.com', color:'#0E7490' },
  { label:'Claude AI', url:'https://claude.ai/new', color:'#DB2777' },
];
let QUICK_LINKS = DEFAULT_QUICK_LINKS.map(l=>({ ...l }));
function normalizeLinks(incoming){
  if(Array.isArray(incoming) && incoming.length){
    return incoming
      .filter(l=> l && typeof l === 'object')
      .map(l=>({
        label: (l.label || 'Untitled').toString(),
        url: (l.url || '#').toString(),
        color: (l.color || '#2563EB').toString(),
      }));
  }
  return DEFAULT_QUICK_LINKS.map(l=>({ ...l }));
}
function normalizeUrl(u){
  const trimmed = (u||'').trim();
  if(!trimmed) return '';
  if(/^https?:\/\//i.test(trimmed)) return trimmed;
  return 'https://' + trimmed;
}
function addQuickLink(label, url, color){
  const l = (label||'').trim();
  const u = normalizeUrl(url);
  if(!l || !u) return false;
  QUICK_LINKS.push({ label:l, url:u, color: color || '#2563EB' });
  scheduleSave();
  renderTabs();
  return true;
}
function updateQuickLink(index, label, url, color){
  if(!QUICK_LINKS[index]) return false;
  const l = (label||'').trim();
  const u = normalizeUrl(url);
  if(!l || !u) return false;
  QUICK_LINKS[index] = { label:l, url:u, color: color || QUICK_LINKS[index].color || '#2563EB' };
  scheduleSave();
  renderTabs();
  return true;
}
function removeQuickLink(index){
  if(!QUICK_LINKS[index]) return false;
  QUICK_LINKS.splice(index, 1);
  scheduleSave();
  renderTabs();
  return true;
}

// ====== INFORMATIONS PAGE (shared cards: a big bold title + free text) ======
let INFO_CARDS = [];   // [{ id, title, text, ts }]
function normalizeInfoCards(incoming){
  if(!Array.isArray(incoming)) return [];
  return incoming.filter(c=> c && typeof c === 'object').map(c=>({
    id: String(c.id || ('i' + Math.random().toString(36).slice(2,9))),
    title: String(c.title || ''),
    text: String(c.text || ''),
    ts: Number(c.ts) || Date.now(),
  }));
}
function addInfoCard(title, text){
  if(!isAdmin()) return false;
  const t = (title||'').trim();
  const x = (text||'').trim();
  if(!t && !x) return false;
  INFO_CARDS.unshift({ id: 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2,6), title: t, text: x, ts: Date.now() });
  scheduleSave();
  renderTabs();
  return true;
}
function removeInfoCard(id){
  if(!isAdmin()) return false;
  const i = INFO_CARDS.findIndex(c=> c.id === id);
  if(i < 0) return false;
  INFO_CARDS.splice(i, 1);
  scheduleSave();
  renderTabs();
  return true;
}

function themeFor(personId){
  return PERSON_THEME[personId] || PERSON_THEME.omar;
}

// ====== ADD NEW MEMBER (admin only) ======
// New members get a slug id, an auto-generated crew color, and empty starter data.
function slugifyName(name){
  const base = name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-+|-+$)/g, '');
  return base || 'member';
}
function uniqueMemberId(name){
  let id = slugifyName(name);
  if(id === MANAGER_ID || id === LINKS_ID || id === ACCOUNTS_ID || id === AUDIO_ID || id === VIDEO_ID || id === THUMB_ID || id === INFO_ID) id = id + '-member';
  let candidate = id;
  let n = 2;
  const taken = new Set(PEOPLE.map(p=>p.id));
  while(taken.has(candidate) || candidate === MANAGER_ID || candidate === LINKS_ID || candidate === ACCOUNTS_ID || candidate === AUDIO_ID || candidate === VIDEO_ID || candidate === THUMB_ID || candidate === INFO_ID){
    candidate = `${id}-${n}`;
    n++;
  }
  return candidate;
}
function generateThemeColor(id){
  let hash = 0;
  for(let i=0; i<id.length; i++){ hash = id.charCodeAt(i) + ((hash << 5) - hash); }
  const hue = Math.abs(hash) % 360;
  return {
    color: `hsl(${hue}, 62%, 52%)`,
    dark:  `hsl(${hue}, 62%, 32%)`,
    soft:  `hsla(${hue}, 62%, 52%, 0.14)`,
    line:  `hsla(${hue}, 62%, 52%, 0.35)`,
    ring:  `hsla(${hue}, 62%, 52%, 0.22)`,
  };
}

// NOTE: this cache used to hold only apiKeys/transcriptKeys/avatars. That meant the
// board data, member list, notes and — critically — the member usernames/passwords
// had NO local fallback at all: they lived only in memory + Firestore. If Firestore
// was slow to connect, blocked (ad-blocker/firewall/private browsing), or the page
// was used before the first snapshot arrived, any edit made in that window would be
// saved on top of whatever was currently in memory — which could be the hardcoded
// empty defaults. That is the main reason logins/passwords and other data appeared
// to "disappear". We now cache the full app state locally too, so the app always
// starts from the last known-good state instead of blank defaults.
const LOCAL_KEY_CACHE = {
  apiKeys: 'scriptDesk_apiKeys',
  transcriptKeys: 'scriptDesk_transcriptKeys',
  avatars: 'scriptDesk_avatars',
  boardState: 'scriptDesk_boardStateCache',

    const cachedTranscript = JSON.parse(localStorage.getItem(LOCAL_KEY_CACHE.transcriptKeys) || '[]');
    const cachedAvatars = JSON.parse(localStorage.getItem(LOCAL_KEY_CACHE.avatars) || '{}');
    if(Array.isArray(cachedApi) && cachedApi.length) apiKeys = cachedApi;
    if(Array.isArray(cachedTranscript) && cachedTranscript.length) transcriptKeys = cachedTranscript;
    if(cachedAvatars && typeof cachedAvatars === 'object') avatars = cachedAvatars;
  }catch(e){ /* localStorage unavailable — Firebase sync still works */ }

function saveKeysToLocalCache(){
  try{
    localStorage.setItem(LOCAL_KEY_CACHE.apiKeys, JSON.stringify(apiKeys));
    localStorage.setItem(LOCAL_KEY_CACHE.transcriptKeys, JSON.stringify(transcriptKeys));
    localStorage.setItem(LOCAL_KEY_CACHE.avatars, JSON.stringify(avatars));

// below). Loaded once at startup, before Firestore has had a chance to connect —
// so the very first render, and anything the user does before the real-time

      renumber(p.id);
      data[p.id].forEach(ensureGroupFields);

  }catch(e){ /* cache unavailable or corrupt — defaults stay in place */ }
}

document.addEventListener('DOMContentLoaded', ()=>{

    // backgrounded tab, then sync automatically once the connection returns, instead
    // of silently failing or losing whatever was typed while offline.
    try{
      db.enablePersistence({ synchronizeTabs: true }).catch(err=>{
        console.warn('Offline persistence unavailable:', err && err.code);

    }catch(e){ /* older browser / already enabled elsewhere — safe to ignore */ }

    docRef = db.collection('scriptDesk').doc('sharedData');
    accountsRef = db.collection('scriptDesk').doc('accounts');
    setSyncStatus('', 'Connecting…');

    docRef.onSnapshot((snap)=>{
      if(snap.metadata.hasPendingWrites) return;
      if(snap.exists){
        const remote = snap.data();
        data = remote.data || data;
        apiKeys = remote.apiKeys || [];
        transcriptKeys = remote.transcriptKeys || [];
        avatars = remote.avatars || {};
        siteLogo = remote.siteLogo || '';

      console.error(err);
      setSyncStatus('offline', 'Offline (check Firebase rules)');
    });

    accountsRef.onSnapshot((snap)=>{
      if(snap.metadata.hasPendingWrites) return;
      if(snap.exists){
        memberAccounts = normalizeMemberAccounts(snap.data().accounts);
        saveAccountsToCache();

let transcriptKeyIndex = 0;

async function fetchTranscriptText(videoId){
  if(!transcriptKeys.length) throw { message: 'No transcript API keys configured' };
  let lastErr = null;
  for(let i=0; i<transcriptKeys.length; i++){
    const key = transcriptKeys[(transcriptKeyIndex + i) % transcriptKeys.length];
    try{
      const res = await fetch(`https://transcriptapi.com/api/v2/youtube/transcript?video_url=${videoId}&format=text&include_timestamp=false`, {
        headers: { 'Authorization': `Bearer ${key}` }
      });
      if(res.status === 401 || res.status === 402 || res.status === 429){
        const body = await res.json().catch(()=>({}));
        lastErr = { status: res.status, message: body?.detail?.message || body?.detail || 'Key failed' };
        continue;
      }
      if(res.status === 404){ throw { status: 404, message: 'No captions available for this video' }; }
      if(!res.ok){
        const body = await res.json().catch(()=>({}));
        throw { status: res.status, message: body?.detail || 'Transcript request failed' };
      }
      const json = await res.json();
      transcriptKeyIndex = (transcriptKeyIndex + i) % transcriptKeys.length;
      return json.transcript;
    }catch(e){
      if(e.status) throw e;
      lastErr = e;
    }
  }
  throw lastErr || { message: 'All transcript API keys failed' };
}
// ====== END TRANSCRIPT API ======

const ytCache = {};

function extractYoutubeId(url){
  if(!url) return null;
  url = url.trim();
  const patterns = [
    /(?:youtube\.com\/watch\?v=)([\w-]{11})/,
    /(?:youtu\.be\/)([\w-]{11})/,
    /(?:youtube\.com\/shorts\/)([\w-]{11})/,
    /(?:youtube\.com\/embed\/)([\w-]{11})/,
  ];
  for(const re of patterns){
    const m = url.match(re);
    if(m) return m[1];
  }
  if(/^[\w-]{11}$/.test(url)) return url;
  return null;
}

function watchUrlFor(ytUrl){
  const id = extractYoutubeId(ytUrl);
  return id ? `https://www.youtube.com/watch?v=${id}` : null;
}

function relativeTime(ts){
  if(!ts) return '';
  const diff = Date.now() - ts;
  const m = Math.floor(diff/60000);
  if(m < 1) return 'just now';
  if(m < 60) return `${m}m ago`;
  const h = Math.floor(m/60);
  if(h < 24) return `${h}h ago`;
  const d = Math.floor(h/24);
  if(d < 7) return `${d}d ago`;
  return new Date(ts).toLocaleDateString();
}

async function fetchYoutubeSnippet(videoId){
  if(ytCache[videoId]) return ytCache[videoId];
  if(!apiKeys.length) throw new Error('No API keys configured');
  let lastErr = null;
  for(let i=0; i<apiKeys.length; i++){
    const key = apiKeys[(ytKeyIndex + i) % apiKeys.length];
    try{
      const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${videoId}&key=${key}`);
      if(res.status === 403){ lastErr = new Error('Key quota exceeded'); continue; }
      if(!res.ok) throw new Error('YouTube API request failed');
      const json = await res.json();
      if(!json.items || !json.items.length) throw new Error('Video not found');
      ytKeyIndex = (ytKeyIndex + i) % apiKeys.length;
      ytCache[videoId] = json.items[0].snippet;
      return ytCache[videoId];
    }catch(e){
      lastErr = e;
      if(e.message !== 'Key quota exceeded') throw e;
    }
  }
  throw lastErr || new Error('All API keys failed');
}

function resizeImageFile(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height){
          if(width > maxSize){ height = Math.round(height * (maxSize/width)); width = maxSize; }
        } else {
          if(height > maxSize){ width = Math.round(width * (maxSize/height)); height = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = ()=> reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = ()=> reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

function avatarInnerHtml(personId, initial){
  return avatars[personId] ? `<img src="${avatars[personId]}" alt="">` : `<span>${initial}</span>`;
}

// ====== WEBSITE IMAGE (header, beside "Salah Gapr") — admin only ======
function renderSiteLogo(){
  const img = document.getElementById('siteLogoImg');
  const addBtn = document.getElementById('siteLogoAddBtn');
  const removeBtn = document.getElementById('siteLogoRemoveBtn');
  if(!img || !addBtn || !removeBtn) return;
  if(siteLogo){
    img.src = siteLogo;
    img.style.display = '';
  } else {
    img.style.display = 'none';
  }
  addBtn.style.display = (isAdmin() && !siteLogo) ? '' : 'none';
  removeBtn.style.display = (isAdmin() && siteLogo) ? '' : 'none';
}
function handleSiteLogoFile(file){
  if(!file) return;
  resizeImageFile(file, 220).then(dataUrl=>{
    siteLogo = dataUrl;
    scheduleSave();
    renderSiteLogo();
    showToast('Website image added');
  }).catch(()=> showToast('Could not load that image'));
}
document.getElementById('siteLogoAddBtn').addEventListener('click', ()=>{
  document.getElementById('siteLogoInput').click();
});
document.getElementById('siteLogoInput').addEventListener('change', (e)=>{
  handleSiteLogoFile(e.target.files[0]);
  e.target.value = '';
});
document.getElementById('siteLogoRemoveBtn').addEventListener('click', ()=>{
  siteLogo = '';
  scheduleSave();
  renderSiteLogo();
  showToast('Website image removed');
});
// ====== END WEBSITE IMAGE ======

function renderTabs(){
  tabsEl.innerHTML = '';

  PEOPLE.forEach(p=>{
    const tab = document.createElement('div');
    tab.className = 'tab' + (p.id===activePerson ? ' active':'');
    tab.dataset.person = p.id;
    applyTabTheme(tab, p.id);
    tab.innerHTML = `
      <div class="tab-avatar-ring" style="--pct:${personPct(p.id)}">
        <div class="tab-avatar" title="Change photo">${avatarInnerHtml(p.id, p.name[0])}</div>
      </div>
      <div class="tab-info">
        <span class="tab-name">${p.name}</span>
        <span class="progress mono">${personSummary(p.id)}</span>
      </div>
      <input type="file" accept="image/*" class="tab-avatar-input" style="display:none;">
    `;
    tab.querySelector('.tab-avatar').addEventListener('click', (e)=>{
      e.stopPropagation();
      tab.querySelector('.tab-avatar-input').click();
    });
    tab.querySelector('.tab-avatar-input').addEventListener('change', (e)=>{
      handleAvatarFile(p.id, e.target.files[0]);
      e.target.value = '';
    });
    tab.addEventListener('click', ()=>{
      activePerson = p.id;
      renderTabs();
      renderBoard();
    });
    tabsEl.appendChild(tab);
  });

  const divider = document.createElement('div');
  divider.className = 'tab-divider';
  tabsEl.appendChild(divider);

  const totalDone = PEOPLE.reduce((sum,p)=> sum + data[p.id].filter(g=>g.done).length, 0);
  const totalAll = PEOPLE.reduce((sum,p)=> sum + data[p.id].length, 0);
  const mgrTab = document.createElement('div');
  mgrTab.className = 'tab' + (activePerson===MANAGER_ID ? ' active':'');
  applyTabTheme(mgrTab, MANAGER_ID);
  mgrTab.innerHTML = `
    <div class="tab-avatar-ring" style="--pct:${totalAll ? Math.round((totalDone/totalAll)*100) : 0}">
      <div class="tab-avatar" title="Change photo">${avatarInnerHtml(MANAGER_ID, 'S')}</div>
    </div>
    <div class="tab-info">
      <span class="tab-name">Salah</span>
      <span class="progress mono">${totalDone}/${totalAll} done</span>
    </div>
    <input type="file" accept="image/*" class="tab-avatar-input" style="display:none;">
  `;
  mgrTab.querySelector('.tab-avatar').addEventListener('click', (e)=>{
    e.stopPropagation();
    mgrTab.querySelector('.tab-avatar-input').click();
  });
  mgrTab.querySelector('.tab-avatar-input').addEventListener('change', (e)=>{
    handleAvatarFile(MANAGER_ID, e.target.files[0]);
    e.target.value = '';
  });
  mgrTab.addEventListener('click', ()=>{
    const wasActive = activePerson === MANAGER_ID;
    activePerson = MANAGER_ID;
    if(!wasActive) managerView = 'overview';
    renderTabs();
    renderBoard();
  });
  const linksTab = document.createElement('div');
  linksTab.className = 'tab' + (activePerson===LINKS_ID ? ' active':'');
  applyTabTheme(linksTab, LINKS_ID);
  linksTab.innerHTML = `
    <div class="tab-avatar-ring" style="--pct:100">
      <div class="tab-avatar" title="Links">${avatarInnerHtml(LINKS_ID, 'L')}</div>
    </div>
    <div class="tab-info">
      <span class="tab-name">Links</span>
      <span class="progress mono">${QUICK_LINKS.length} tools</span>
    </div>
  `;
  linksTab.addEventListener('click', ()=>{
    activePerson = LINKS_ID;
    renderTabs();
    renderBoard();
  });
  tabsEl.appendChild(linksTab);

  // Informations — shared notes cards, visible to the admin AND every member.
  const infoTab = document.createElement('div');
  infoTab.className = 'tab' + (activePerson===INFO_ID ? ' active':'');
  applyTabTheme(infoTab, INFO_ID);
  infoTab.innerHTML = `
    <div class="tab-avatar-ring" style="--pct:100">
      <div class="tab-avatar" title="Informations">${avatarInnerHtml(INFO_ID, '📋')}</div>
    </div>
    <div class="tab-info">
      <span class="tab-name">Informations</span>
      <span class="progress mono">${INFO_CARDS.length} ${INFO_CARDS.length === 1 ? 'card' : 'cards'}</span>
    </div>
  `;
  infoTab.addEventListener('click', ()=>{
    activePerson = INFO_ID;
    renderTabs();
    renderBoard();
  });
  tabsEl.appendChild(infoTab);

  const accountsTab = document.createElement('div');
  accountsTab.className = 'tab' + (activePerson===ACCOUNTS_ID ? ' active':'');
  applyTabTheme(accountsTab, ACCOUNTS_ID);
  accountsTab.innerHTML = `
    <div class="tab-avatar-ring" style="--pct:100">
      <div class="tab-avatar" title="Accounts">${avatarInnerHtml(ACCOUNTS_ID, '🔒')}</div>
    </div>
    <div class="tab-info">
      <span class="tab-name">Accounts</span>
      <span class="progress mono">Channel vault</span>
    </div>
  `;
  accountsTab.addEventListener('click', ()=>{
    activePerson = ACCOUNTS_ID;
    renderTabs();
    renderBoard();
  });

  // Accounts (the channel vault) is visible to everyone who's logged in — members
  // included. It still has its own master-password gate, so this only changes who
  // can *see* the tab and try to unlock it, not who can read the vault's contents.
  tabsEl.appendChild(accountsTab);
  if(isAdmin()){
    tabsEl.appendChild(mgrTab);
  } else if(activePerson === MANAGER_ID){
    // Members still can't open the Salah (admin) page — bounce back to their own board.
    activePerson = currentMemberId || PEOPLE[0].id;
  }
}

function iconSvg(name){
  if(name==='copy'){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
  }
  if(name==='trash'){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;
  }
  if(name==='check'){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
  }
  if(name==='duplicate'){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V4a2 2 0 0 1 2-2h10"/></svg>`;
  }
  if(name==='download'){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M4 19h16"/></svg>`;
  }
  if(name==='grid'){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`;
  }
  if(name==='list'){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`;
  }
  if(name==='edit'){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
  }
  if(name==='user'){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
  }
  if(name==='key'){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5 18 10"/><path d="M18 5l2.5 2.5"/></svg>`;
  }
  if(name==='play'){
    return `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
  }
  if(name==='reel'){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="7.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="16" cy="14" r="1.4" fill="currentColor" stroke="none"/><circle cx="8" cy="14" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/></svg>`;
  }
  return '';
}

function renderBoard(){
  if(activePerson !== LINKS_ID) linksEditingIndex = null;
  if(activePerson === MANAGER_ID){
    if(!isAdmin()){ activePerson = currentMemberId || PEOPLE[0].id; }
    else { renderManagerBoard(); return; }
  }
  if(activePerson === ACCOUNTS_ID){ renderAccountsBoard(); return; }
  if(activePerson === AUDIO_ID){ renderAudioBoard(); return; }
  if(activePerson === THUMB_ID){ renderThumbnailBoard(); return; }
  if(activePerson === LINKS_ID){ renderLinksBoard(); return; }
  if(activePerson === INFO_ID){ renderInfoBoard(); return; }

  boardEl.innerHTML = '';
  const memberBoardWrap = document.createElement('div');
  memberBoardWrap.className = 'member-board';
  boardEl.appendChild(memberBoardWrap);
  const groups = data[activePerson];

  groups.forEach((group, idx)=>{
    ensureGroupFields(group);
    const groupEl = document.createElement('div');
    groupEl.className = 'video-group' + (group.done ? ' done' : '');
    groupEl.dataset.num = group.num;
    groupEl.dataset.person = activePerson;
    groupEl.innerHTML = `
      <div class="video-head">
        <div class="video-head-left">
          ${iconSvg('reel')}<span style="display:contents">${''}</span>
          <h2 class="mono">Video ${group.num}</h2>
          <span class="status-chip mono">${group.done ? 'Done' : 'In progress'}</span>
        </div>
        <div class="video-head-right">
          ${isAdmin() ? `<button class="btn btn-ghost btn-sm duplicate-btn">${iconSvg('duplicate')} Duplicate</button>` : ''}
          ${isAdmin() && groups.length > 1 ? `<button class="btn btn-ghost btn-sm btn-danger delete-btn">${iconSvg('trash')} Delete</button>` : ''}
          <button class="done-toggle ${group.done ? 'is-done':''}">
            <span class="check-circle">${iconSvg('check')}</span>
            ${group.done ? 'Done' : 'Mark done'}
          </button>
        </div>
      </div>
      <div class="yt-row">
        <span class="yt-label mono">Source video</span>
        <input type="text" class="yt-url-input" placeholder="Paste the source YouTube link here (used to pull script / title / description / tags)…" value="${escapeHtml(group.ytUrl)}" ${isAdmin() ? '' : 'readonly'}>
        <button class="yt-btn yt-site-btn">Get Script</button>
        <button class="yt-btn yt-title-btn">Get Title</button>
        <button class="yt-btn yt-desc-btn">Get Description</button>
        <button class="yt-btn yt-tags-btn">Get Tags</button>
        <button class="yt-btn yt-thumb-btn">Get Thumbnail</button>
      </div>
      <div class="yt-row uploaded-row">
        <span class="yt-label mono">Uploaded video</span>
        <input type="text" class="uploaded-url-input" placeholder="Paste the link to the video YOU uploaded — required to mark this reel done, shown on the dashboard…" value="${escapeHtml(group.finalUrl)}">
      </div>
      <div class="grid"></div>
    `;

    const reelIconEl = groupEl.querySelector('.reel-icon') || groupEl.querySelector('.video-head-left svg');
    if(reelIconEl) reelIconEl.classList.add('reel-icon');

    const ytInput = groupEl.querySelector('.yt-url-input');
    ytInput.addEventListener('input', ()=>{
      group.ytUrl = ytInput.value;
      ytInput.classList.remove('input-error');
      scheduleSave();
    });
    const uploadedInput = groupEl.querySelector('.uploaded-url-input');
    uploadedInput.addEventListener('input', ()=>{
      group.finalUrl = uploadedInput.value;
      uploadedInput.classList.remove('input-error');
      scheduleSave();
    });
    groupEl.querySelector('.yt-site-btn').addEventListener('click', ()=>{
      const videoId = extractYoutubeId(group.ytUrl);
      const url = videoId
        ? `https://youtubetotranscript.com/transcript?v=${videoId}&current_language_code=en`
        : 'https://youtubetotranscript.com';
      window.open(url, '_blank');
    });
    groupEl.querySelector('.yt-title-btn').addEventListener('click', ()=> handleYoutubeAction(group, 'title'));
    groupEl.querySelector('.yt-desc-btn').addEventListener('click', ()=> handleYoutubeAction(group, 'description'));
    groupEl.querySelector('.yt-tags-btn').addEventListener('click', ()=> handleYoutubeAction(group, 'tags'));
    groupEl.querySelector('.yt-thumb-btn').addEventListener('click', ()=> handleYoutubeAction(group, 'thumbnail'));

    const grid = groupEl.querySelector('.grid');

    CARD_TYPES.forEach(type=>{
      if(!group.cards[type.key]) group.cards[type.key] = { text:'' };
      const state = group.cards[type.key];
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.type = type.key;

      const bodyHtml = `<div class="card-body" contenteditable="${isAdmin() ? 'true' : 'false'}" data-placeholder="${type.placeholder}">${escapeHtml(state.text)}</div>`;
      const isTitle = type.key === 'title';

      card.innerHTML = `
        <div class="card-head">
          <span class="card-label mono">${type.label}</span>
          <div class="card-actions">
            <button class="copy-btn-text" title="Copy">${iconSvg('copy')} Copy</button>
            ${isTitle ? `<button class="download-thumb-btn" title="Download thumbnail">${iconSvg('download')} Download Thumbnail</button>` : ''}
            ${isAdmin() ? `<button class="icon-btn clear-btn" title="Clear">${iconSvg('trash')}</button>` : ''}
          </div>
        </div>
        ${isTitle ? `
        <div class="title-row">
          ${bodyHtml}
          <img class="title-thumb-preview" src="${group.thumbnailUrl || ''}" alt="Thumbnail" style="${group.thumbnailUrl ? '' : 'display:none;'}">
        </div>` : bodyHtml}
      `;

      const body = card.querySelector('.card-body');
      body.addEventListener('input', ()=>{ state.text = body.innerText; scheduleSave(); });
      body.addEventListener('blur', ()=>{ state.text = body.innerText; scheduleSave(); });

      card.querySelector('.copy-btn-text').addEventListener('click', ()=>{
        const text = body.innerText;
        if(!text.trim()){ showToast('Nothing to copy'); return; }
        navigator.clipboard.writeText(text).then(()=>{
          showToast(`${type.label} copied`);
        }).catch(()=>{
          showToast('Copy failed');
        });
      });

      const clearBtn = card.querySelector('.clear-btn');
      if(clearBtn) clearBtn.addEventListener('click', ()=>{
        body.innerText = '';
        state.text = '';
        body.focus();
        scheduleSave();
      });

      if(isTitle){
        card.querySelector('.download-thumb-btn').addEventListener('click', async ()=>{
          if(!group.thumbnailUrl){ showToast('Click "Get Thumbnail" first'); return; }
          try{
            const res = await fetch(group.thumbnailUrl);
            const blob = await res.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = `video-${group.num}-thumbnail.jpg`;
            a.click();
            URL.revokeObjectURL(blobUrl);
            showToast('Thumbnail downloaded');
          }catch(e){
            window.open(group.thumbnailUrl, '_blank');
            showToast('Opened thumbnail in new tab');
          }
        });
      }

      grid.appendChild(card);
    });

    groupEl.querySelector('.done-toggle').addEventListener('click', ()=>{
      if(!group.done){
        const videoId = extractYoutubeId(group.finalUrl);
        if(!videoId){
          showToast('Paste the uploaded video link before marking this reel done');
          const input = groupEl.querySelector('.uploaded-url-input');
          input.classList.add('input-error');
          input.focus();
          setTimeout(()=> input.classList.remove('input-error'), 900);
          return;
        }
        group.done = true;
        group.completedAt = Date.now();
      } else {
        group.done = false;
        group.completedAt = null;
      }
      renderTabs();
      renderBoard();
      scheduleSave();
    });

    const duplicateBtn = groupEl.querySelector('.duplicate-btn');
    if(duplicateBtn){
      duplicateBtn.addEventListener('click', ()=>{
        const newGroup = { cards: emptyCards(), done:false, ytUrl:'', finalUrl:'', thumbnailUrl:'', completedAt:null };
        groups.splice(idx + 1, 0, newGroup);
        renumber(activePerson);
        renderTabs();
        renderBoard();
        scheduleSave();
        showToast(`Video ${newGroup.num} created`);
      });
    }

    const deleteBtn = groupEl.querySelector('.delete-btn');
    if(deleteBtn){
      deleteBtn.addEventListener('click', ()=>{
        groups.splice(idx, 1);
        renumber(activePerson);
        renderTabs();
        renderBoard();
        scheduleSave();
        showToast(`Video ${group.num} deleted`);
      });
    }

    memberBoardWrap.appendChild(groupEl);
  });
}

function escapeRegExp(str){
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function buildEditorSection(){
  const wrap = document.createElement('div');

  const title = document.createElement('div');
  title.className = 'mgr-section-title';
  title.textContent = 'Shared notes — search & edit';
  wrap.appendChild(title);

  const toolbar = document.createElement('div');
  toolbar.className = 'editor-toolbar';
  toolbar.innerHTML = `
    <input type="text" class="editor-input search-input" placeholder="Search a word…">
    <button class="editor-btn find-btn">Find</button>
    <button class="editor-btn nav-btn prev-btn" title="Previous match">◀</button>
    <button class="editor-btn nav-btn next-btn" title="Next match">▶</button>
    <span class="editor-match-count"></span>
    <span class="editor-divider"></span>
    <input type="text" class="editor-input replace-input" placeholder="Replace with…">
    <button class="editor-btn replace-btn">Replace All</button>
    <button class="editor-btn clear-hl-btn">Clear highlights</button>
  `;
  wrap.appendChild(toolbar);

  const notes = document.createElement('div');
  notes.className = 'editor-notes';
  notes.contentEditable = 'true';
  notes.dataset.placeholder = 'Write shared notes here… use search above to find and edit a specific word.';
  notes.innerText = sharedNotes.editorText || '';
  wrap.appendChild(notes);

  const searchInput = toolbar.querySelector('.search-input');
  const replaceInput = toolbar.querySelector('.replace-input');
  const matchCountEl = toolbar.querySelector('.editor-match-count');
  let matchCursor = -1;

  function syncText(){
    sharedNotes.editorText = notes.innerText;
    scheduleSave();
  }
  notes.addEventListener('input', syncText);
  notes.addEventListener('blur', syncText);

  function attachMarkClicks(){
    notes.querySelectorAll('.search-hit').forEach(mark=>{
      mark.addEventListener('click', (e)=>{
        e.stopPropagation();
        const range = document.createRange();
        range.selectNodeContents(mark);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        notes.focus();
      });
    });
  }

  function renderHighlights(term){
    const text = notes.innerText;
    sharedNotes.editorText = text;
    const escapedText = escapeHtml(text);
    if(!term){ notes.innerHTML = escapedText; return 0; }
    const escapedTerm = escapeHtml(term);
    const re = new RegExp(escapeRegExp(escapedTerm), 'gi');
    let count = 0;
    const html = escapedText.replace(re, (m)=>{ count++; return `<mark class="search-hit">${m}</mark>`; });
    notes.innerHTML = html;
    attachMarkClicks();
    return count;
  }

  function updateMatchCount(count){
    matchCountEl.textContent = count ? `${count} match${count>1?'es':''}` : (searchInput.value.trim() ? 'No matches' : '');
  }

  function highlightCurrent(){
    const hits = notes.querySelectorAll('.search-hit');
    hits.forEach(m=> m.classList.remove('current'));
    if(!hits.length) return;
    matchCursor = ((matchCursor % hits.length) + hits.length) % hits.length;
    const current = hits[matchCursor];
    current.classList.add('current');
    current.scrollIntoView({ block:'center', behavior:'smooth' });
  }

  toolbar.querySelector('.find-btn').addEventListener('click', ()=>{
    const term = searchInput.value.trim();
    if(!term){ showToast('Type a word to search for'); return; }
    const count = renderHighlights(term);
    matchCursor = 0;
    updateMatchCount(count);
    if(count) highlightCurrent();
  });
  toolbar.querySelector('.next-btn').addEventListener('click', ()=>{
    if(!notes.querySelectorAll('.search-hit').length) return;
    matchCursor++;
    highlightCurrent();
  });
  toolbar.querySelector('.prev-btn').addEventListener('click', ()=>{
    if(!notes.querySelectorAll('.search-hit').length) return;
    matchCursor--;
    highlightCurrent();
  });
  toolbar.querySelector('.replace-btn').addEventListener('click', ()=>{
    const term = searchInput.value.trim();
    if(!term){ showToast('Type a word to search for'); return; }
    const replaceWith = replaceInput.value;
    const re = new RegExp(escapeRegExp(term), 'gi');
    const text = notes.innerText;
    const count = (text.match(re) || []).length;
    const newText = text.replace(re, replaceWith);
    sharedNotes.editorText = newText;
    notes.innerHTML = escapeHtml(newText);
    scheduleSave();
    updateMatchCount(0);
    showToast(count ? `Replaced ${count} match${count>1?'es':''}` : 'No matches found');
  });
  toolbar.querySelector('.clear-hl-btn').addEventListener('click', ()=>{
    notes.innerHTML = escapeHtml(notes.innerText);
    searchInput.value = '';
    updateMatchCount(0);
  });
  searchInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); toolbar.querySelector('.find-btn').click(); }
  });

  const ctaTitle = document.createElement('div');

  ctaTitle.textContent = 'Per-person CTAs';
  wrap.appendChild(ctaTitle);

  const ctaGrid = document.createElement('div');
  ctaGrid.className = 'cta-grid';

  PEOPLE.forEach(p=>{
    if(sharedNotes.ctas[p.id] === undefined) sharedNotes.ctas[p.id] = '';
    const box = document.createElement('div');
    box.className = 'card';
    applyTabTheme(box, p.id);
    box.innerHTML = `
      <div class="card-head">
        <span class="card-label mono">${p.name} CTA</span>
        <div class="card-actions">
          <button class="copy-btn-text" title="Copy">${iconSvg('copy')} Copy</button>
          <button class="icon-btn cta-clear-btn" title="Clear">${iconSvg('trash')}</button>
        </div>
      </div>
      <div class="card-body cta-body" contenteditable="true" data-placeholder="Write ${p.name}'s call-to-action…">${escapeHtml(sharedNotes.ctas[p.id])}</div>
    `;
    const body = box.querySelector('.cta-body');
    body.addEventListener('input', ()=>{ sharedNotes.ctas[p.id] = body.innerText; scheduleSave(); });
    body.addEventListener('blur', ()=>{ sharedNotes.ctas[p.id] = body.innerText; scheduleSave(); });
    box.querySelector('.copy-btn-text').addEventListener('click', ()=>{
      const text = body.innerText;
      if(!text.trim()){ showToast('Nothing to copy'); return; }
      navigator.clipboard.writeText(text).then(()=> showToast(`${p.name} CTA copied`)).catch(()=> showToast('Copy failed'));
    });
    box.querySelector('.cta-clear-btn').addEventListener('click', ()=>{
      body.innerText = '';
      sharedNotes.ctas[p.id] = '';
      scheduleSave();
    });
    ctaGrid.appendChild(box);
  });

  wrap.appendChild(ctaGrid);
  return wrap;
}

function buildKeyManagerSection(title, keysArray, placeholder, emptyMsg){
  const keySection = document.createElement('div');
  keySection.innerHTML = `<div class="mgr-section-title">${title}</div>`;

  const addRow = document.createElement('div');
  addRow.className = 'mgr-key-add';
  addRow.innerHTML = `
    <input type="text" class="mgr-key-input" placeholder="${placeholder}">
    <button class="mgr-key-add-btn">Add key</button>
  `;
  const keyInput = addRow.querySelector('.mgr-key-input');
  addRow.querySelector('.mgr-key-add-btn').addEventListener('click', ()=>{
    const val = keyInput.value.trim();
    if(!val){ showToast('Paste a key first'); return; }
    if(keysArray.includes(val)){ showToast('That key is already added'); return; }
    keysArray.push(val);
    saveKeysToLocalCache();
    scheduleSave();
    renderTabs();
    renderManagerBoard();
    showToast('API key added');
  });
  keyInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') addRow.querySelector('.mgr-key-add-btn').click(); });
  keySection.appendChild(addRow);

  const keyList = document.createElement('div');
  keyList.className = 'mgr-key-list';
  if(!keysArray.length){
    keyList.innerHTML = `<div class="mgr-key-empty">${emptyMsg}</div>`;
  } else {
    keysArray.forEach((key, i)=>{
      const row = document.createElement('div');
      row.className = 'mgr-key-row';
      const masked = key.length > 8 ? `${key.slice(0,4)}••••••••${key.slice(-4)}` : '••••••••';
      row.innerHTML = `
        <span class="mgr-key-val">Key ${i+1}: ${masked}</span>
        <span class="mgr-key-del" title="Remove">${iconSvg('trash')}</span>
      `;
      row.querySelector('.mgr-key-del').addEventListener('click', ()=>{
        keysArray.splice(i, 1);
        saveKeysToLocalCache();
        scheduleSave();
        renderTabs();
        renderManagerBoard();
        showToast('Key removed');
      });
      keyList.appendChild(row);
    });
  }
  keySection.appendChild(keyList);
  return keySection;
}

function ringHtml(pct, trackColor, fillColor, size, stroke, textColor){
  size = size || 58; stroke = stroke || 6; textColor = textColor || '#0f2545';
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - Math.max(0, Math.min(100, pct)) / 100);
  return `
  <div class="ring-wrap" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${trackColor}" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${fillColor}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}" transform="rotate(-90 ${size/2} ${size/2})"/>
    </svg>
    <div class="ring-center-text mono" style="color:${textColor}; font-size:${Math.round(size*0.22)}px;">${pct}%</div>
  </div>`;
}

function buildActivityCard(){
  const card = document.createElement('div');
  card.className = 'activity-card';

  const completed = [];
  PEOPLE.forEach(p=> data[p.id].forEach(g=>{ if(g.done) completed.push({ person:p, group:g }); }));
  completed.sort((a,b)=> (b.group.completedAt||0) - (a.group.completedAt||0));
  const recent = completed.slice(0, 6);

  const titleRow = document.createElement('div');
  titleRow.className = 'mgr-panel-title';
  titleRow.textContent = `Recent activity — ${completed.length} completed in total`;
  card.appendChild(titleRow);

  const list = document.createElement('div');
  list.className = 'activity-list';

  if(!recent.length){
    list.innerHTML = `<div class="empty-note">No reels marked done yet — completions will show up here the moment someone finishes one.</div>`;
  } else {
    recent.forEach(({person, group})=>{

      const watchUrl = watchUrlFor(group.finalUrl);
      const row = document.createElement('div');

function buildAccountsSection(){
  const wrap = document.createElement('div');
  wrap.className = 'mgr-panel';

  title.className = 'mgr-panel-title';
  title.textContent = 'Member accounts — sign members up to log in';

  sub.className = 'acct-status';
  sub.textContent = 'Set a username and password for each member below. They\'ll use these to log in on the Member tab. Leave blank to keep that member logged out.';
  wrap.appendChild(sub);

  addTitle.className = 'mgr-panel-title';
  addTitle.style.fontSize = '13px';
  addTitle.style.marginTop = '4px';
  addTitle.textContent = 'Add a new member';
  wrap.appendChild(addTitle);

  const addRow = document.createElement('div');
  addRow.className = 'acct-add-row';

    <input type="text" class="acct-add-input" placeholder="New member's name (e.g. Montaser)">
    <button type="button" class="acct-add-btn">${iconSvg('user')} Add Member</button>
  `;
  const addInput = addRow.querySelector('.acct-add-input');
  const submitAdd = ()=>{
    const name = addInput.value.trim();
    if(!name){ showToast('Enter a name first'); addInput.focus(); return; }
    if(PEOPLE.some(p=> p.name.toLowerCase() === name.toLowerCase())){
      showToast('A member with that name already exists');
      return;
    }
    addMember(name);
    renderTabs();
    renderManagerBoard();
    showToast(`${name} added — set their login below`);
  };
  addRow.querySelector('.acct-add-btn').addEventListener('click', submitAdd);
  addInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submitAdd(); });
  wrap.appendChild(addRow);

  const listTitle = document.createElement('div');
  listTitle.className = 'mgr-panel-title';
  listTitle.style.fontSize = '13px';
  listTitle.style.marginTop = '20px';
  listTitle.textContent = 'Existing members';
  wrap.appendChild(listTitle);

  PEOPLE.forEach(p=>{
    if(!memberAccounts[p.id]) memberAccounts[p.id] = { username:'', password:'', adminAccess:false };
    const acct = memberAccounts[p.id];
    const row = document.createElement('div');
    row.className = 'acct-row';
    // Only the real admin (Salah's own login, not an admin-enabled member) can grant
    // or revoke admin access — an admin-enabled member sees their own switch as a
    // read-only label instead of a toggle they could use on themselves or others.
    const adminToggleHtml = isRealAdmin()
      ? `<label class="acct-admin-toggle" title="Let ${escapeHtml(p.name)} log in with full admin powers">
           <input type="checkbox" class="acct-admin-input" ${acct.adminAccess ? 'checked' : ''}> Admin access
         </label>`
      : `<span class="acct-admin-toggle acct-admin-readonly">${acct.adminAccess ? 'Admin access: on' : 'Admin access: off'}</span>`;
    row.innerHTML = `
      <span class="acct-name">${p.name}</span>
      <input type="text" class="acct-username-input" placeholder="Username" value="${escapeHtml(acct.username)}">
      <input type="text" class="acct-password-input" placeholder="Password" value="${escapeHtml(acct.password)}">
      ${adminToggleHtml}
      <button type="button" class="acct-save-btn">Save</button>
      <button type="button" class="btn btn-sm delete-btn acct-remove-btn" title="Remove member">${iconSvg('trash')} Remove</button>
    `;
    row.querySelector('.acct-save-btn').addEventListener('click', ()=>{
      const u = row.querySelector('.acct-username-input').value.trim();
      const pw = row.querySelector('.acct-password-input').value;
      const adminInput = row.querySelector('.acct-admin-input');
      // Admin access can only change via the real admin's own toggle; an admin-enabled
      // member re-saving their username/password keeps whatever it already was.
      const nextAdminAccess = isRealAdmin() ? (adminInput ? adminInput.checked : false) : !!acct.adminAccess;
      memberAccounts[p.id] = { username:u, password:pw, adminAccess: nextAdminAccess };
      scheduleAccountsSave();
      showToast(u && pw ? `${p.name}'s login saved` : `${p.name}'s login cleared`);
    });
    row.querySelector('.acct-remove-btn').addEventListener('click', ()=>{
      if(PEOPLE.length <= 1){ showToast('You need at least one member'); return; }
      const ok = window.confirm(`Remove ${p.name} and delete their entire page? This can't be undone.`);
      if(!ok) return;
      const removed = removeMember(p.id);
      if(removed){
        renderTabs();
        renderManagerBoard();
        showToast(`${p.name} removed`);
      }
    });
    wrap.appendChild(row);
  });

  return wrap;
}

// null = nothing being edited; 'new' = the "add link" tile is open; a number =
// index of the link currently being edited. Reset whenever we leave the page.
let linksEditingIndex = null;

function buildLinkEditCard(existing, onSave, onCancel){
  const card = document.createElement('div');
  card.className = 'link-edit-card';
  card.innerHTML = `
    <input type="text" class="link-edit-label" placeholder="Label (e.g. Canva)" value="${escapeHtml(existing ? existing.label : '')}">
    <div class="link-edit-row">
      <input type="text" class="link-edit-url" placeholder="https://…" value="${escapeHtml(existing ? existing.url : '')}">
      <input type="color" class="link-edit-color" value="${existing ? existing.color : '#2563EB'}">
    </div>
    <div class="link-edit-buttons">
      <button type="button" class="btn btn-ghost btn-sm link-edit-cancel">Cancel</button>
      <button type="button" class="btn btn-brass btn-sm link-edit-save">Save</button>
    </div>
  `;
  const labelInput = card.querySelector('.link-edit-label');
  const urlInput = card.querySelector('.link-edit-url');
  const colorInput = card.querySelector('.link-edit-color');
  const submit = ()=>{
    const ok = onSave(labelInput.value, urlInput.value, colorInput.value);
    if(ok === false){ showToast('Add a label and a link first'); return; }
  };
  card.querySelector('.link-edit-save').addEventListener('click', submit);
  card.querySelector('.link-edit-cancel').addEventListener('click', onCancel);
  [labelInput, urlInput].forEach(inp=> inp.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submit(); }));
  return card;
}

function renderLinksBoard(){
  boardEl.innerHTML = '';

  const wrap = document.createElement('div');

  const sectionTitle = document.createElement('div');
  sectionTitle.className = 'mgr-section-title';
  sectionTitle.textContent = 'Links — quick tools';
  wrap.appendChild(sectionTitle);

  const grid = document.createElement('div');
  grid.className = 'links-grid';
  const admin = isAdmin();

  QUICK_LINKS.forEach((link, i)=>{
    if(admin && linksEditingIndex === i){
      grid.appendChild(buildLinkEditCard(link, (label, url, color)=>{
        if(!label.trim() || !url.trim()) return false;
        updateQuickLink(i, label, url, color);
        linksEditingIndex = null;
        renderLinksBoard();
        showToast('Link updated');
      }, ()=>{ linksEditingIndex = null; renderLinksBoard(); }));
      return;
    }

    const a = document.createElement('a');
    a.className = 'link-tile';
    a.href = link.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.style.background = link.color;
    a.innerHTML = `<span>${escapeHtml(link.label)}</span>`;

    if(admin){
      const actions = document.createElement('div');
      actions.className = 'link-tile-actions';
      actions.innerHTML = `
        <button type="button" class="link-tile-actionbtn link-edit-btn" title="Edit link">${iconSvg('edit')}</button>
        <button type="button" class="link-tile-actionbtn link-del-btn" title="Remove link">${iconSvg('trash')}</button>
      `;
      actions.querySelector('.link-edit-btn').addEventListener('click', (e)=>{
        e.preventDefault(); e.stopPropagation();
        linksEditingIndex = i;
        renderLinksBoard();
      });
      actions.querySelector('.link-del-btn').addEventListener('click', (e)=>{
        e.preventDefault(); e.stopPropagation();
        if(!confirm(`Remove "${link.label}"?`)) return;
        removeQuickLink(i);
        renderLinksBoard();
        showToast('Link removed');
      });
      a.appendChild(actions);
    }

    grid.appendChild(a);
  });

  if(admin){
    if(linksEditingIndex === 'new'){
      grid.appendChild(buildLinkEditCard(null, (label, url, color)=>{
        if(!label.trim() || !url.trim()) return false;
