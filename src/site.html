// ====== ACCOUNTS VAULT (encrypted channel logins) ======
// A self-contained password vault for channel logins (YouTube email, password,
// recovery email — one card per name, many channels per card). It's end-to-end
// encrypted with a master password that only the admin knows: nothing is ever
// stored or transmitted in plain text, and — by design — it lives only in this
// browser's localStorage rather than syncing through Firestore like the rest of
// the board, so the encrypted data never has to leave this device.
const VAULT_STORAGE_KEY = 'scriptDesk_vault_v1';
const vaultEnc = new TextEncoder();
const vaultDec = new TextDecoder();
let vaultCryptoKey = null;   // derived AES-GCM key, kept only in memory while unlocked
let vaultPeople = null;      // decrypted array of {id, name, entries[]}, kept only in memory while unlocked
let vaultUnlocked = false;
let vaultIsNew = false;
let vaultSearchQuery = '';

function vaultDefaultPeople(){
  return [
    { id:'omar', name:'Omar', entries: [] },
    { id:'amr', name:'Amr', entries: [] }
  ];
}
function vaultB64encode(buf){
  const bytes = new Uint8Array(buf);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function vaultB64decode(str){
  const bin = atob(str);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function vaultUid(){ return Math.random().toString(36).slice(2,9); }
function vaultLoadRecord(){
  try{
    const raw = localStorage.getItem(VAULT_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ console.error('Vault read failed', e); return null; }
}
function vaultSaveRecord(rec){
  try{ localStorage.setItem(VAULT_STORAGE_KEY, JSON.stringify(rec)); return true; }
  catch(e){ console.error('Vault save failed', e); return false; }
}
function vaultDeriveKey(password, saltBuf){
  return crypto.subtle.importKey('raw', vaultEnc.encode(password), {name:'PBKDF2'}, false, ['deriveKey'])
    .then(keyMaterial => crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: saltBuf, iterations: 210000, hash:'SHA-256' },
      keyMaterial,
      { name:'AES-GCM', length:256 },
      false,
      ['encrypt','decrypt']
    ));
}
function vaultEncryptPeople(){
  const record = vaultLoadRecord() || {};
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const plaintext = vaultEnc.encode(JSON.stringify(vaultPeople));
  return crypto.subtle.encrypt({name:'AES-GCM', iv}, vaultCryptoKey, plaintext).then(cipherBuf=>{
    vaultSaveRecord({ salt: record.salt, iv: vaultB64encode(iv), data: vaultB64encode(cipherBuf) });
  });
}
function vaultDecryptPeople(record){
  const iv = new Uint8Array(vaultB64decode(record.iv));
  return crypto.subtle.decrypt({name:'AES-GCM', iv}, vaultCryptoKey, vaultB64decode(record.data))
    .then(plainBuf => vaultNormalizeToPeople(JSON.parse(vaultDec.decode(plainBuf))));
}
// Accepts either the current {id,name,entries[]} shape, or a flat legacy list, and
// always returns a valid structure so old saved data is never lost.
function vaultNormalizeToPeople(parsed){
  if(!Array.isArray(parsed) || parsed.length === 0) return vaultDefaultPeople();
  const looksLikePeople = parsed.every(p=> p && typeof p === 'object' && Array.isArray(p.entries));
  if(looksLikePeople) return parsed;
  const migrated = vaultDefaultPeople();
  migrated[0].entries = parsed.map(old=>({
    channelName: old.channelName || old.label || '',
    email: old.email || '',
    password: old.password || '',
    recovery: old.recovery || ''
  }));
  return migrated;
}
function vaultPersist(){
  vaultEncryptPeople().catch(e=>{ console.error(e); showToast('Vault save failed'); });
}
function vaultCopy(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=> showToast('Copied')).catch(()=> vaultFallbackCopy(text));
  } else { vaultFallbackCopy(text); }
}
function vaultFallbackCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Copied');
  }catch(e){ showToast("Couldn't copy"); }
}

// ====== AUDIO MAKER (visible to admin AND every member) ======
// Paste .wav links -> downloads + joins them in order -> cuts the result into
// equal-length parts (default 9:45 each) -> download each part or all as a .zip.
// Everything runs locally in the browser. The panel is built once and re-attached
// when you come back to the tab, so an in-progress merge survives tab switching.
const AudioMaker = (()=>{
  let root = null;
  let running = false;
  let objectUrls = [];
  let lastParts = [];
  const $ = (sel)=> root.querySelector(sel);

  function parseTime(str){
    const s = (str||'').trim();
    if(!s) return 0;
    if(s.includes(':')){
      const [m, sec] = s.split(':');
      return (parseInt(m,10)||0)*60 + (parseFloat(sec)||0);
    }
    const n = parseFloat(s);
    return isNaN(n) ? 0 : n*60;            // a plain number means minutes
  }
  function fmtTime(sec){
    const t = Math.round(sec);
    return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0');
  }
  function yieldUI(){ return new Promise(r=> setTimeout(r, 0)); }

  function encodeWav(buffer){
    const numChannels = buffer.numberOfChannels, sampleRate = buffer.sampleRate, numFrames = buffer.length;
    const blockAlign = numChannels * 2, dataSize = numFrames * blockAlign;
    const arr = new ArrayBuffer(44 + dataSize), view = new DataView(arr);
    const wstr = (o, s)=>{ for(let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); };
    wstr(0,'RIFF'); view.setUint32(4, 36+dataSize, true); wstr(8,'WAVE'); wstr(12,'fmt ');
    view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,numChannels,true);
    view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*blockAlign,true);
    view.setUint16(32,blockAlign,true); view.setUint16(34,16,true); wstr(36,'data'); view.setUint32(40,dataSize,true);
    const ch = []; for(let c=0;c<numChannels;c++) ch.push(buffer.getChannelData(c));
    let off = 44;
    for(let i=0;i<numFrames;i++){
      for(let c=0;c<numChannels;c++){
        let s = Math.max(-1, Math.min(1, ch[c][i]));
        view.setInt16(off, s < 0 ? s*0x8000 : s*0x7fff, true); off += 2;
      }
    }
    return new Blob([arr], { type:'audio/wav' });
  }

  function encodeMp3(buffer){
    const numChannels = Math.min(2, buffer.numberOfChannels);
    const enc = new lamejs.Mp3Encoder(numChannels, buffer.sampleRate, 128);
    const out = [], block = 1152, n = buffer.length;
    const toInt16 = (f)=>{ const o = new Int16Array(f.length); for(let i=0;i<f.length;i++){ const s = Math.max(-1,Math.min(1,f[i])); o[i] = s<0 ? s*0x8000 : s*0x7fff; } return o; };
    const left = toInt16(buffer.getChannelData(0));
    const right = numChannels === 2 ? toInt16(buffer.getChannelData(1)) : null;
    for(let i=0;i<n;i+=block){
      const b = right ? enc.encodeBuffer(left.subarray(i,i+block), right.subarray(i,i+block)) : enc.encodeBuffer(left.subarray(i,i+block));
      if(b.length) out.push(b);
    }
    const end = enc.flush(); if(end.length) out.push(end);
    return new Blob(out, { type:'audio/mpeg' });
  }

  // Minimal "store" (no compression) ZIP writer — audio is already compressed/dense anyway.
  const CRC_TABLE = (()=>{ const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();
  function crc32(u8){ let c = 0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_TABLE[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
  function makeZip(files){ // files: [{name, data:Uint8Array}]
    const enc = new TextEncoder(), parts = [], central = [];
    let offset = 0;
    files.forEach(f=>{
      const nm = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
      const lh = new Uint8Array(30 + nm.length), lv = new DataView(lh.buffer);
      lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0x0800,true); lv.setUint16(8,0,true);
      lv.setUint16(10,0,true); lv.setUint16(12,0x21,true); lv.setUint32(14,crc,true); lv.setUint32(18,size,true);
      lv.setUint32(22,size,true); lv.setUint16(26,nm.length,true); lv.setUint16(28,0,true); lh.set(nm,30);
      const ch = new Uint8Array(46 + nm.length), cv = new DataView(ch.buffer);
      cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint16(8,0x0800,true);
      cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0x21,true); cv.setUint32(16,crc,true);
      cv.setUint32(20,size,true); cv.setUint32(24,size,true); cv.setUint16(28,nm.length,true);
      cv.setUint32(42,offset,true); ch.set(nm,46);
      parts.push(lh, f.data); central.push(ch);
      offset += lh.length + size;
    });
    const cSize = central.reduce((s,c)=> s + c.length, 0);
    const end = new Uint8Array(22), ev = new DataView(end.buffer);
    ev.setUint32(0,0x06054b50,true); ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
    ev.setUint32(12,cSize,true); ev.setUint32(16,offset,true);
    return new Blob([...parts, ...central, end], { type:'application/zip' });
  }

  function build(){
    root = document.createElement('div');
    applyTabTheme(root, AUDIO_ID);
    root.innerHTML = `
      <div class="mgr-dash-header">
        <div>
          <div class="mgr-dash-title">🎧 Audio Maker</div>
          <div class="mgr-dash-sub">Merge .wav links in order, then cut the result into equal parts</div>
        </div>
      </div>
      <div class="au-panel">
        <label class="au-label" for="auLinks">Links (one per line, in playback order)</label>
        <textarea id="auLinks" class="au-textarea" placeholder="https://.../track1.wav&#10;https://.../track2.wav&#10;https://.../track3.wav"></textarea>
        <div class="au-row">
          <div class="au-field">
            <label class="au-label" for="auFormat">Format</label>
            <select id="auFormat" class="au-select">
              <option value="wav">WAV (always works, larger)</option>
              <option value="mp3">MP3 (smaller)</option>
            </select>
          </div>
          <div class="au-field">
            <label class="au-label" for="auLen">Length per file (mm:ss)</label>
            <input id="auLen" class="au-input" type="text" value="9:45" placeholder="9:45">
            <div class="au-hint">0 = don't split</div>
          </div>
          <button type="button" class="au-btn" id="auStart">Download &amp; Merge</button>
          <button type="button" class="au-btn ghost" id="auClear">Clear</button>
        </div>
        <div class="au-progress" id="auProgress"><div class="au-progress-fill" id="auFill"></div></div>
        <div class="au-summary" id="auSummary"></div>
        <div class="au-list" id="auList"></div>
      </div>
      <div id="auResults" style="display:none;">
        <div class="au-parts-head">
          <div class="au-parts-title" id="auPartsTitle"></div>
          <button type="button" class="au-btn" id="auZip" style="display:none;">Download all (.zip)</button>
        </div>
        <div class="au-parts" id="auParts"></div>
      </div>
      <div class="au-notes">
        <strong>Notes</strong><br>
        • Everything runs in your browser — nothing is uploaded anywhere.<br>
        • Files are cut at exact times, so a cut can land mid-word. Use a slightly different length if that happens.<br>
        • If a link fails with a network/CORS error, that server blocks direct browser downloads — open the link in a new tab and save the file instead.<br>
        • Files with different sample rates or channel counts are converted to match the first file, so there's no pitch or speed change.
      </div>`;
    $('#auStart').addEventListener('click', run);
    $('#auClear').addEventListener('click', clearAll);
    $('#auZip').addEventListener('click', downloadZip);
  }

  function resetResults(){
    objectUrls.forEach(u=> URL.revokeObjectURL(u));
    objectUrls = []; lastParts = [];
    $('#auParts').innerHTML = '';
    $('#auResults').style.display = 'none';
  }
  function clearAll(){
    if(running) return;
    $('#auLinks').value = '';
    $('#auList').style.display = 'none'; $('#auList').innerHTML = '';
    $('#auProgress').style.display = 'none';
    $('#auSummary').textContent = '';
    resetResults();
  }
  function setStatus(row, cls, text){
    const el = row.querySelector('.au-status'); el.className = 'au-status ' + cls; el.textContent = text;
  }

  async function run(){
    if(running) return;
    const summary = $('#auSummary'), fill = $('#auFill'), list = $('#auList');
    const urls = $('#auLinks').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!urls.length){ summary.textContent = 'Paste at least one link first.'; return; }
    const chunkSec = parseTime($('#auLen').value);
    if(chunkSec !== 0 && chunkSec < 5){ summary.textContent = 'Length per file must be at least 0:05 (or 0 to not split).'; return; }

    running = true; $('#auStart').disabled = true;
    resetResults();
    list.innerHTML = ''; list.style.display = 'block';
    $('#auProgress').style.display = 'block'; fill.style.width = '0%';

    const rows = urls.map((url,i)=>{
      const row = document.createElement('div'); row.className = 'au-item';
      row.innerHTML = `<span class="au-idx">${i+1}</span><span class="au-url">${escapeHtml(url)}</span><span class="au-status pending">waiting</span>`;
      list.appendChild(row); return row;
    });

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const decoded = []; let failures = 0;
    try{
      for(let i=0;i<urls.length;i++){
        setStatus(rows[i], 'working', 'downloading…');
        summary.textContent = `Fetching ${i+1} of ${urls.length}…`;
        try{
          const res = await fetch(urls[i]);
          if(!res.ok) throw new Error('HTTP ' + res.status);
          const ab = await res.arrayBuffer();
          setStatus(rows[i], 'working', 'decoding…');
          decoded.push(await audioCtx.decodeAudioData(ab.slice(0)));
          setStatus(rows[i], 'ok', 'done');
        }catch(err){
          setStatus(rows[i], 'err', 'failed');
          rows[i].querySelector('.au-url').title = err.message;
          failures++;
        }
        fill.style.width = Math.round(((i+1)/urls.length)*60) + '%';
      }
      if(!decoded.length){ summary.textContent = 'Nothing could be downloaded. Check the links or CORS restrictions on the source server.'; return; }

      summary.textContent = 'Merging audio…';
      await yieldUI();
      const rate = decoded[0].sampleRate, chans = decoded[0].numberOfChannels;
      const normalized = [];
      for(const buf of decoded){
        if(buf.sampleRate === rate && buf.numberOfChannels === chans){ normalized.push(buf); continue; }
        const off = new OfflineAudioContext(chans, Math.ceil(buf.duration*rate), rate);
        const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
        normalized.push(await off.startRendering());
      }
      const total = normalized.reduce((s,b)=> s + b.length, 0);
      const merged = audioCtx.createBuffer(chans, total, rate);
      let pos = 0;
      for(const buf of normalized){
        for(let c=0;c<chans;c++) merged.getChannelData(c).set(buf.getChannelData(c), pos);
        pos += buf.length;
      }
      fill.style.width = '70%';

      const wantMp3 = $('#auFormat').value === 'mp3';
      const useMp3 = wantMp3 && window.lamejs;
      const ext = useMp3 ? 'mp3' : 'wav';
      const chunkFrames = chunkSec > 0 ? Math.round(chunkSec*rate) : total;
      const count = Math.ceil(total / chunkFrames);
      const pad = Math.max(2, String(count).length);

      const parts = [];
      for(let p=0;p<count;p++){
        summary.textContent = `Encoding part ${p+1} of ${count}…`;
        await yieldUI();
        const start = p*chunkFrames, end = Math.min(total, start+chunkFrames);
        let buf = merged;
        if(count > 1){
          buf = audioCtx.createBuffer(chans, end-start, rate);
          for(let c=0;c<chans;c++) buf.getChannelData(c).set(merged.getChannelData(c).subarray(start,end));
        }
        const blob = useMp3 ? encodeMp3(buf) : encodeWav(buf);
        const name = count > 1 ? `audio-part-${String(p+1).padStart(pad,'0')}.${ext}` : `merged-audio.${ext}`;
        parts.push({ name, blob, dur:(end-start)/rate });
        fill.style.width = (70 + Math.round(((p+1)/count)*30)) + '%';
      }

      lastParts = parts;
      const partsEl = $('#auParts'); partsEl.innerHTML = '';
      parts.forEach((part, i)=>{
        const url = URL.createObjectURL(part.blob); objectUrls.push(url);
        const card = document.createElement('div'); card.className = 'au-part';
        card.innerHTML = `
          <div class="au-part-top"><span class="au-part-name">${count>1 ? 'Part '+(i+1) : 'Merged track'}</span><span class="au-part-dur">${fmtTime(part.dur)}</span></div>
          <audio controls preload="metadata" src="${url}"></audio>
          <a class="au-btn" href="${url}" download="${part.name}">Download ${part.name}</a>`;
        partsEl.appendChild(card);
      });
      $('#auPartsTitle').textContent = count > 1
        ? `Split into ${count} files · ${fmtTime(total/rate)} total`
        : `1 file · ${fmtTime(total/rate)}`;
      $('#auZip').style.display = count > 1 ? '' : 'none';
      $('#auResults').style.display = 'block';

      fill.style.width = '100%';
      const okCount = decoded.length;
      summary.textContent = (failures > 0
        ? `Done. Merged ${okCount} of ${urls.length} tracks (${failures} failed — see list above).`
        : `Done. Merged all ${okCount} tracks in order.`)
        + (wantMp3 && !useMp3 ? ' MP3 encoder unavailable, used WAV instead.' : '');
    }catch(err){
      summary.textContent = 'Something went wrong: ' + err.message;
    }finally{
      try{ audioCtx.close(); }catch(e){}
      running = false; $('#auStart').disabled = false;
    }
  }

  async function downloadZip(){
    if(!lastParts.length) return;
    const btn = $('#auZip'); btn.disabled = true; const old = btn.textContent; btn.textContent = 'Preparing zip…';
    try{
      const files = [];
      for(const p of lastParts) files.push({ name:p.name, data:new Uint8Array(await p.blob.arrayBuffer()) });
      const url = URL.createObjectURL(makeZip(files));
      const a = document.createElement('a'); a.href = url; a.download = 'audio-parts.zip';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 60000);
    }catch(err){ showToast('Could not build the zip'); }
    btn.disabled = false; btn.textContent = old;
  }

  function mount(container){
    if(!root) build();
    if(root.parentNode === container && container.children.length === 1) return; // don't disturb playing audio on background re-renders
    container.innerHTML = '';
    container.appendChild(root);
  }
  return { mount };
})();

const THUMB_DEFAULT_REPLACE = `I'm uploading 2 images.
Image 1 is a YouTube thumbnail that features a doctor.

TASK: Recreate the thumbnail from Image 1, but replace the doctor with the person from Image 2, and change the thumbnail by about 20%.

- Give them a similar outfit style to what the doctor wore so it still fits the theme of the thumbnail.
- Match the lighting, colour grading and shadows, and use a clean cut-out edge, so the person looks like a natural part of the scene.

2) CHANGE THE THUMBNAIL BY ABOUT 20%
- Keep about 80% the same: the overall composition, style, mood, main subject position and the core message of the thumbnail.
- Change about 20% so it is clearly not a copy: slightly change the background colours or details, move secondary elements a little, adjust the text wording, colour or placement, and vary small icons, props or graphics.

OUTPUT
- 16:9 landscape YouTube thumbnail, high resolution, sharp, high contrast, eye-catching.

const THUMB_DEFAULT_ADD = `I'm uploading 2 images.

TASK: Put the doctor from Image 2 inside the thumbnail from Image 1.

- BLEND: Match the lighting direction, colour grading and shadows of the thumbnail, use a clean sharp cut-out edge, and add a subtle outline or glow if it helps them stand out, so the doctor looks like a natural part of the scene.
- EVERYTHING ELSE: Keep the rest of the thumbnail (background, text, graphics, style) the same. Only nudge or resize small elements if that is needed to make room for the doctor.

OUTPUT

function buildVaultGate(){
  const existingRecord = vaultLoadRecord();
  vaultIsNew = !existingRecord;

  const box = document.createElement('div');
  box.className = 'vault-gate';
  box.innerHTML = `
    <div class="vault-gate-mark">🔒</div>
    <h2>${vaultIsNew ? 'Create a master password' : 'Unlock the accounts vault'}</h2>
    <p>${vaultIsNew
      ? "This password encrypts every channel login below. It isn't stored anywhere — if it's lost, the saved entries can't be recovered."
      : 'Enter the master password to decrypt the saved channel logins.'}</p>
    <input type="password" class="vault-pw1" placeholder="Master password" autocomplete="off">
    ${vaultIsNew ? '<input type="password" class="vault-pw2" placeholder="Confirm master password" autocomplete="off">' : ''}
    <button type="button" class="acct-add-btn" style="width:100%; justify-content:center;">${vaultIsNew ? 'Create vault' : 'Unlock'}</button>
    <div class="vault-gate-error"></div>
    ${!vaultIsNew ? `<div class="vault-gate-reset"><button type="button" class="vault-reset-btn">Forgot it? Erase this device's vault and start over</button></div>` : ''}
  `;

  const pw1 = box.querySelector('.vault-pw1');
  const pw2 = box.querySelector('.vault-pw2');
  const errEl = box.querySelector('.vault-gate-error');

  function submit(){
    errEl.textContent = '';
    const v1 = pw1.value;
    if(!v1){ errEl.textContent = 'Enter a password.'; return; }

    if(vaultIsNew){
      const v2 = pw2 ? pw2.value : '';
      if(v1.length < 4){ errEl.textContent = 'Use at least 4 characters.'; return; }
      if(v1 !== v2){ errEl.textContent = "Passwords don't match."; return; }
      const salt = crypto.getRandomValues(new Uint8Array(16));
      vaultDeriveKey(v1, salt).then(key=>{
        vaultCryptoKey = key;
        vaultPeople = vaultDefaultPeople();
        vaultSaveRecord({ salt: vaultB64encode(salt), iv:null, data:null });
        return vaultEncryptPeople();
      }).then(()=>{
        vaultUnlocked = true;
        renderAccountsBoard();
      }).catch(e=>{ console.error(e); errEl.textContent = 'Something went wrong creating the vault.'; });
    } else {
      const record = vaultLoadRecord();
      const saltBuf = vaultB64decode(record.salt);
      vaultDeriveKey(v1, saltBuf).then(key=>{
        vaultCryptoKey = key;
        return vaultDecryptPeople(record);
      }).then(decrypted=>{
        vaultPeople = decrypted;
        vaultUnlocked = true;
        renderAccountsBoard();
      }).catch(()=>{ errEl.textContent = "Wrong password, or this data can't be read."; });
    }
  }

  box.querySelector('.acct-add-btn').addEventListener('click', submit);
  pw1.addEventListener('keydown', e=>{ if(e.key === 'Enter') submit(); });
  if(pw2) pw2.addEventListener('keydown', e=>{ if(e.key === 'Enter') submit(); });

  const resetBtn = box.querySelector('.vault-reset-btn');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    if(!confirm("This permanently deletes every channel login saved in this vault on this device. Continue?")) return;
    try{ localStorage.removeItem(VAULT_STORAGE_KEY); }catch(e){}
    vaultCryptoKey = null; vaultPeople = null; vaultUnlocked = false;
    renderAccountsBoard();
  });

  return box;
}

function buildVaultUnlocked(){
  const container = document.createElement('div');

  const toolbar = document.createElement('div');

  toolbar.innerHTML = `

function renderVaultPersonCard(person, q){
  if(!Array.isArray(person.entries)) person.entries = [];
  const filtered = person.entries.filter((en, idx)=>{
    en.__idx = idx;
    if(!q) return true;
    return (en.channelName||'').toLowerCase().indexOf(q) > -1 || (en.email||'').toLowerCase().indexOf(q) > -1;
  });

  const card = document.createElement('div');
  card.className = 'vault-card';

  const head = document.createElement('div');
  head.className = 'vault-card-head';
  head.innerHTML = `
    <h3>${escapeHtml(person.name)}</h3>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="vault-count">${person.entries.length} ${person.entries.length===1?'channel':'channels'}</span>
      <div class="vault-card-actions">
        <button type="button" class="vault-iconbtn vault-rename-btn" title="Rename card">${iconSvg('edit')}</button>
        <button type="button" class="vault-iconbtn danger vault-remove-card-btn" title="Remove card">${iconSvg('trash')}</button>
      </div>
    </div>
  `;
  head.querySelector('.vault-rename-btn').addEventListener('click', ()=>{
    const name = prompt('Rename this card', person.name);
    if(name === null) return;
    const trimmed = name.trim();
    if(!trimmed) return;
    person.name = trimmed;
    vaultPersist();
    renderAccountsBoard();
  });
  head.querySelector('.vault-remove-card-btn').addEventListener('click', ()=>{
    if(!confirm(`Remove ${person.name}'s card and all ${person.entries.length} saved channel(s)? This can't be undone.`)) return;
    vaultPeople = vaultPeople.filter(p=> p.id !== person.id);
    vaultPersist();
    renderAccountsBoard();
  });
  card.appendChild(head);

  const body = document.createElement('div');
  body.className = 'vault-card-body';
  const list = document.createElement('div');
  list.className = 'vault-entries';

  if(person.entries.length === 0){
    list.innerHTML = `<div class="vault-empty">No channels added yet.</div>`;
  } else if(filtered.length === 0){
    list.innerHTML = `<div class="vault-empty">No matches.</div>`;
  } else {
    filtered.forEach(entry=> list.appendChild(renderVaultEntry(person, entry, entry.__idx)));
  }
  body.appendChild(list);

  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'vault-add-entry-btn';
  addBtn.textContent = '+ Add channel';
  addBtn.addEventListener('click', ()=>{
    person.entries.unshift({ channelName:'', email:'', password:'', recovery:'' });
    vaultPersist();
    renderAccountsBoard();
    requestAnimationFrame(()=>{
      const cards = document.querySelectorAll('.vault-card');
      const match = Array.prototype.find.call(cards, c=> c.querySelector('h3') && c.querySelector('h3').textContent === person.name);
      const firstLabel = match && match.querySelector('.vault-entry-label');
      if(firstLabel) firstLabel.focus();
    });
  });
  body.appendChild(addBtn);

  card.appendChild(body);
  return card;
}

function renderVaultEntry(person, entry, idx){
  const box = document.createElement('div');
  box.className = 'vault-entry';

  const head = document.createElement('div');
  head.className = 'vault-entry-head';
  const label = document.createElement('input');
  label.className = 'vault-entry-label';
  label.value = entry.channelName || '';
  label.placeholder = 'Untitled channel';
  label.addEventListener('change', ()=>{ entry.channelName = label.value.trim(); vaultPersist(); });
  head.appendChild(label);

  const delBtn = document.createElement('button');
  delBtn.type = 'button';
  delBtn.className = 'vault-iconbtn danger';
  delBtn.title = 'Delete channel';
  delBtn.innerHTML = iconSvg('trash');
  delBtn.addEventListener('click', ()=>{
    if(!confirm(`Delete ${entry.channelName || 'this channel'}?`)) return;
    person.entries.splice(idx, 1);
    vaultPersist();
    renderAccountsBoard();
  });
  head.appendChild(delBtn);
  box.appendChild(head);

  box.appendChild(vaultFieldRow('Channel email', entry, 'email', false));
  box.appendChild(vaultFieldRow('Channel password', entry, 'password', true));
  box.appendChild(vaultFieldRow('Recovery email', entry, 'recovery', false));

  return box;
}

function vaultFieldRow(labelText, entry, key, isSecret){
  const field = document.createElement('div');
  field.className = 'vault-field';
  const label = document.createElement('label');
  label.textContent = labelText;
  field.appendChild(label);

  const row = document.createElement('div');
  row.className = 'vault-field-row';
  const input = document.createElement('input');
  input.type = isSecret ? 'password' : 'text';
  input.value = entry[key] || '';
  input.addEventListener('change', ()=>{ entry[key] = input.value; vaultPersist(); });
  row.appendChild(input);

  if(isSecret){
    const toggleBtn = document.createElement('button');
    toggleBtn.type = 'button';
    toggleBtn.className = 'vault-iconbtn';
    toggleBtn.title = 'Show/hide';
    toggleBtn.textContent = '👁';
    toggleBtn.addEventListener('click', ()=>{ input.type = input.type === 'password' ? 'text' : 'password'; });
    row.appendChild(toggleBtn);
  }

  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'vault-iconbtn';
  copyBtn.title = 'Copy';
  copyBtn.textContent = '⧉';
  copyBtn.addEventListener('click', ()=> vaultCopy(input.value));
  row.appendChild(copyBtn);

  field.appendChild(row);
  return field;
}

  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(parsed.data){
        data = parsed.data;
        apiKeys = parsed.apiKeys || apiKeys;
        transcriptKeys = parsed.transcriptKeys || transcriptKeys;
        avatars = parsed.avatars || avatars;
        siteLogo = parsed.siteLogo || siteLogo;

        PEOPLE = (parsed.people && parsed.people.length) ? parsed.people : PEOPLE;
        ensurePersonThemes();
        sharedNotes = normalizeSharedNotes(parsed.sharedNotes);
        memberAccounts = normalizeMemberAccounts(parsed.memberAccounts);
        PEOPLE.forEach(p=>{ if(!data[p.id]) data[p.id] = [ { num:1, cards: emptyCards(), done:false, ytUrl:'', finalUrl:'', thumbnailUrl:'', completedAt:null } ]; renumber(p.id); data[p.id].forEach(ensureGroupFields); });
        renderTabs();
        renderBoard();
        renderSiteLogo();
        scheduleSave();
        scheduleAccountsSave();
        showToast('Imported');
      } else {
        showToast('Invalid file');
      }
    }catch(err){
      showToast('Invalid file');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ====== LOGIN GATE WIRING ======
const loginGate = document.getElementById('loginGate');
const memberLoginForm = document.getElementById('memberLoginForm');
const adminLoginForm = document.getElementById('adminLoginForm');
const loginError = document.getElementById('loginError');
const rolePill = document.getElementById('rolePill');
const logoutBtn = document.getElementById('logoutBtn');
let loginRoleTab = 'member';

document.querySelectorAll('.login-tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.login-tab-btn').forEach(b=> b.classList.remove('active'));
    btn.classList.add('active');
    loginRoleTab = btn.dataset.role;
    memberLoginForm.style.display = loginRoleTab === 'member' ? '' : 'none';
    adminLoginForm.style.display = loginRoleTab === 'admin' ? '' : 'none';
    loginError.textContent = '';
  });
});

function attemptLogin(){
  loginError.textContent = '';
  if(loginRoleTab === 'admin'){
    const u = document.getElementById('adminUsername').value.trim();
    const p = document.getElementById('adminPassword').value;
    if(u === ADMIN_USERNAME && p === ADMIN_PASSWORD){
      startSession('admin', null);
    } else {
      loginError.textContent = 'Incorrect admin username or password.';
    }
  } else {
    const u = document.getElementById('memberUsername').value.trim();
    const p = document.getElementById('memberPassword').value;
    if(!u || !p){ loginError.textContent = 'Enter your username and password.'; return; }
    const match = PEOPLE.find(person=>{
      const acct = memberAccounts[person.id];
      return acct && acct.username && acct.username === u && acct.password === p;
    });
    if(match){
      startSession('member', match.id);
    } else {
      loginError.textContent = "Incorrect username or password, or your account hasn't been set up yet — ask Salah.";
    }
  }
}

function startSession(role, memberId){
  currentRole = role;
  currentMemberId = memberId;
  try{ sessionStorage.setItem(SESSION_KEY, JSON.stringify({ role, memberId })); }catch(e){}
  if(role === 'member') activePerson = memberId;
  loginGate.classList.add('hidden');
  rolePill.style.display = '';
  const memberName = (PEOPLE.find(p=>p.id===memberId)||{}).name || '';
  const memberIsAdmin = role === 'member' && memberAccounts[memberId] && memberAccounts[memberId].adminAccess;
  rolePill.textContent = role === 'admin' ? 'Admin — Salah' : `Member — ${memberName}${memberIsAdmin ? ' (admin access)' : ''}`;
  logoutBtn.style.display = '';
  renderTabs();
  renderBoard();
  renderSiteLogo();
}

function restoreSession(){
  try{
    const raw = sessionStorage.getItem(SESSION_KEY);
    if(!raw) return false;
    const parsed = JSON.parse(raw);
    if(parsed.role === 'admin'){ startSession('admin', null); return true; }
    if(parsed.role === 'member' && PEOPLE.some(p=>p.id===parsed.memberId)){ startSession('member', parsed.memberId); return true; }
  }catch(e){ /* ignore */ }
  return false;
}

document.getElementById('loginSubmitBtn').addEventListener('click', attemptLogin);
[memberLoginForm, adminLoginForm].forEach(form=>{
  form.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') attemptLogin(); });
});

logoutBtn.addEventListener('click', ()=>{
  currentRole = null;
  currentMemberId = null;
  try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){}
  loginGate.classList.remove('hidden');
  rolePill.style.display = 'none';
  logoutBtn.style.display = 'none';
  document.getElementById('memberUsername').value = '';
  document.getElementById('memberPassword').value = '';
  document.getElementById('adminUsername').value = '';
  document.getElementById('adminPassword').value = '';
  loginError.textContent = '';
  renderSiteLogo();
});

restoreSession();
// ====== END LOGIN GATE WIRING ======

renderTabs();
renderBoard();
renderSiteLogo();
</script>
</body>
</html>
